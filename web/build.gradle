plugins {
    id 'com.android.application'
}
// App phụ "Trình duyệt + Ổ mềm": chứa GeckoView (Firefox) tách riêng khỏi app chính (app chính chỉ dùng WebView hệ thống), nên hai lõi không còn chung một tiến trình.
// Phiên bản GeckoView đọc từ gecko.version ở thư mục gốc (giống app chính trước đây).
def geckoVer = rootProject.file('gecko.version').exists() ? rootProject.file('gecko.version').text.trim() : ''
if (!(geckoVer ==~ /^128\.[0-9A-Za-z.\-]+$/)) geckoVer = '128.+'
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation "org.mozilla.geckoview:geckoview-omni:${geckoVer}"
}
android {
    namespace 'com.desktopmini.web'
    compileSdk 34
    defaultConfig {
        applicationId 'com.desktopmini.tvweb'
        minSdk 24
        targetSdk 34
        // Cùng số phiên bản với app chính (cùng một lần build) để app chính biết bản phụ đã cũ hay chưa
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "2.0.${run}"
        def abis = ((project.findProperty('abis') ?: 'x86') as String).split(',').collect { it.trim() }.findAll { it }
        ndk { abiFilters.addAll(abis) }
        resConfigs 'vi', 'en'
    }
    signingConfigs {
        release {
            // Cùng chữ ký với app chính (GitHub Secrets); không có thì dùng chữ ký debug
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
    }
}
