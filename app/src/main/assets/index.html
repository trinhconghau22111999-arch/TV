<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{--bl:20px;color-scheme:light}html,body{margin:0}
/* Ghi âm */
.rc{position:relative;display:flex;flex-direction:column;height:100%;padding:36px 16px 12px;background:#131218;color:#ffffff;overflow:hidden;container-type:size;-webkit-user-select:none;user-select:none}
.rc .rcm{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rc .rcx{flex:none;display:flex;flex-direction:column;min-height:0}
.rc .rcs{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rc .rcl{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
.rc h2{margin:0 0 clamp(4px,2.4cqh,14px);text-align:center;font-size:clamp(13px,3.4cqh,18px);letter-spacing:.28em;text-transform:uppercase;font-weight:800;color:#ffffff;text-shadow:0 0 14px rgba(255,255,255,.55)}
.rc .rcw{flex:none;height:clamp(40px,17cqh,120px);border-radius:16px;background:#000;border:1px solid rgba(255,255,255,.25);overflow:hidden}
.rc .rcv{display:block;width:100%;height:100%}
.rc .rctime{flex:none;margin:clamp(6px,2.6cqh,16px) 0 clamp(4px,2.2cqh,14px);text-align:center;font-size:clamp(24px,6.8cqh,38px);font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:#ffffff;text-shadow:0 0 16px rgba(255,255,255,.55)}
.rc .rcbt{flex:none;display:flex;justify-content:center;gap:24px}
.rc .rcb{width:clamp(40px,9.5cqh,54px);height:clamp(40px,9.5cqh,54px);border-radius:50%;border:2px solid #ffffff;background:#2a2a31;color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,255,255,.4)}
.rc .rcb svg{width:22px;height:22px}
.rc .rcb:disabled{opacity:.35;box-shadow:none}
.rc .rcb.rcp{border-color:rgba(255,255,255,.35);box-shadow:none}
.rc .rcb.rcr i{display:block;width:24px;height:24px;border-radius:50%;background:#ff3860;transition:border-radius .15s,width .15s,height .15s}
.rc .rcb.rcr.on i{width:18px;height:18px;border-radius:5px}
.rc .rch{flex:none;margin:clamp(6px,2.4cqh,18px) 0 clamp(4px,1.6cqh,10px);padding-top:clamp(6px,2cqh,14px);border-top:1px solid rgba(255,255,255,.2);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#a0a0a8}
.rc .rce{padding:14px;text-align:center;font-size:13px;letter-spacing:.08em;color:#a0a0a8}
.rc .rci{flex:none;margin-bottom:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(255,255,255,.02)}
.rc .rcn,.rc .rcin{display:block;width:100%;font-size:14px;line-height:1.3;margin-bottom:8px;color:#ffffff}
.rc .rcn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .rcin{padding:4px 8px;border:1px solid #ffffff;border-radius:8px;background:#000;font:inherit;font-size:14px;outline:0;-webkit-user-select:text;user-select:text}
.rc .rcc{display:flex;align-items:center;gap:10px}
.rc .rcpl{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff;color:#ffffff;display:flex;align-items:center;justify-content:center}
.rc .rcpl svg{width:14px;height:14px}
.rc .rcpr{flex:1;height:16px;display:flex;align-items:center;cursor:pointer}
.rc .rcpr::before{content:"";position:absolute}
.rc .rcpr{position:relative}
.rc .rcpr b{display:block;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.rc .rcpr i{display:block;height:100%;width:0;background:#ffffff}
.rc .rctm{flex:none;font-size:12px;color:#a79dbd;font-variant-numeric:tabular-nums}
.rc .rcsp{flex:none;min-width:38px;padding:4px 7px;border:1px solid #ffffff;border-radius:8px;color:#ffffff;font-size:12px}
.rc .rcmn{flex:none;width:26px;height:30px;color:#ffffff;font-size:20px;line-height:1}
.rc .rcmenu{position:absolute;z-index:5;width:190px;padding:4px;border:1px solid #7a35c9;border-radius:12px;background:#14101e;box-shadow:0 0 22px rgba(255,255,255,.35)}
.rc .rcmenu button{display:block;width:100%;padding:11px 14px;text-align:left;font-size:14px;color:#ffffff;border-radius:8px}
.rc .rcmenu button.dg{color:#ff4d6d}
/* Cửa sổ rất thấp: bỏ tiêu đề cho gọn. Cửa sổ ngang (rộng hơn cao): điều khiển bên trái, danh sách bên phải */
@container (max-height:330px){.rc h2{display:none}}
@container (min-aspect-ratio:7/5){
  .rc .rcm{flex-direction:row;gap:18px}
  .rc .rcx{flex:0 0 44%;min-width:0;justify-content:center}
  .rc .rcs{min-width:0}
  .rc .rch{margin-top:0;padding-top:0;border-top:0}
}

/* Kéo thả tệp */
.rf .rup{width:34px;height:52px;font-size:22px;line-height:1}
.rf .rup:disabled{opacity:.3}
.rfi.dgs{opacity:.4}
.dzh{background:var(--sel)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.dgh{position:fixed;z-index:99999;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:220px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.32);color:var(--fg);font-size:13px;transform:translate(-50%,-130%)}
.dgh .gi{flex:none;width:28px;height:28px;display:grid;place-items:center}.dgh .gi .fic{transform:scale(.7)}
.dgh b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Webcam */
.cm{position:relative;display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;padding:38px 18px 16px;background:#131218;color:#ffffff;-webkit-user-select:none;user-select:none}
.cm h2{flex:none;margin:0 0 12px;text-align:center;font-size:18px;letter-spacing:.28em;text-transform:uppercase;font-weight:800;color:#ffffff;text-shadow:0 0 14px rgba(255,255,255,.55)}
.cm .cmv{position:relative;flex:1 1 0;min-height:0;border-radius:16px;background:#000;border:1px solid rgba(255,255,255,.25);overflow:hidden}
.cm .cmvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cm .cmvid.mir{transform:scaleX(-1)}
.cm .cmmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:13px;line-height:1.5;color:#d8d8dc;cursor:pointer}
.cm .cmblink{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .08s}
.cm .cmblink.on{opacity:.55}
.cm .cmst{flex:none;margin:10px 0 0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a0a0a8}
.cm .cmbt{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:0 6px}
.cm .cmth{width:48px;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.03);overflow:hidden;padding:0}
.cm .cmth img{display:none;width:100%;height:100%;object-fit:cover}
.cm .cmth.has img{display:block}
.cm .cmsh{width:70px;height:70px;border-radius:50%;border:3px solid #ffffff;background:#2a2a31;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,255,255,.45)}
.cm .cmsh i{display:block;width:52px;height:52px;border-radius:50%;background:#ffffff;transition:transform .08s}
.cm .cmsh:active i{transform:scale(.88)}
.cm .cmsw{width:48px;height:48px;border-radius:50%;border:2px solid #ffffff;color:#ffffff;display:flex;align-items:center;justify-content:center}
.cm .cmsw svg{width:24px;height:24px}
.cm .cmrc{width:70px;height:70px;border-radius:50%;border:3px solid #ffffff;background:#2a2a31;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 18px rgba(255,255,255,.45)}
.cm .cmrc i{display:block;width:52px;height:52px;border-radius:50%;background:#ff3b30;transition:border-radius .12s,width .12s,height .12s}
.cm .cmrc:active i{transform:scale(.88)}
.cm .cmrc.rec i{width:28px;height:28px;border-radius:6px}
.cm .cmsw:disabled{opacity:.4}
@media (max-height:560px){.cm{padding:34px 14px 10px}.cm h2{margin:0 0 6px;font-size:15px}.cm .cmst{margin-top:6px}.cm .cmbt{margin-top:8px}}
</style>
<title>Desktop Mini</title>
<style>
/* Layout: một màn hình bo góc. Menu bar trong suốt, dock kính nổi dưới đáy, cửa sổ bo lớn có đèn giao thông, các lớp phủ (Launchpad, Mission Control, khóa) phủ lên trên. */
:root{
  --bg:#e7e8ec; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.1);
  --win:#ffffff; --side:rgba(238,238,243,.68); --hdr:rgba(255,255,255,.72);
  --glass:rgba(250,250,253,.66); --glass-line:rgba(255,255,255,.7); --menu-hi:#0a7aff;
  --accent:#0a7aff; --row:rgba(0,0,0,.035); --field:rgba(120,120,128,.14); --sel:rgba(120,120,128,.24);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --fg:#f4f4f7; --muted:#a0a0a9; --line:rgba(255,255,255,.12);
    --win:#1f2024; --side:rgba(52,53,60,.62); --hdr:rgba(40,41,46,.72);
    --glass:rgba(44,45,52,.62); --glass-line:rgba(255,255,255,.16);
    --accent:#3d95ff; --row:rgba(255,255,255,.045); --field:rgba(120,120,128,.26); --sel:rgba(120,120,128,.34);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --fg:#f4f4f7; --muted:#a0a0a9; --line:rgba(255,255,255,.12);
  --win:#1f2024; --side:rgba(52,53,60,.62); --hdr:rgba(40,41,46,.72);
  --glass:rgba(44,45,52,.62); --glass-line:rgba(255,255,255,.16);
  --accent:#3d95ff; --row:rgba(255,255,255,.045); --field:rgba(120,120,128,.26); --sel:rgba(120,120,128,.34);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding-inline:16px;padding-block:16px;background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;text-align:inherit}
input,textarea{font:inherit;color:inherit}
/* Ô nhập luôn gõ được (stage đang tắt user-select nên WebView Android chặn bàn phím) */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul,ol{margin:0;padding:0;list-style:none}
.grow{flex:1}
.none{padding:26px 16px;text-align:center;color:var(--muted)}
.lnk{color:var(--accent)}
.lnk:hover{text-decoration:underline}

.stage{--base:54px;position:relative;height:100%;min-height:560px;border-radius:16px;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;
  background:radial-gradient(70% 55% at 18% -5%,#9be8ff 0,transparent 60%),radial-gradient(60% 60% at 92% 18%,#8aa8ff 0,transparent 62%),radial-gradient(90% 70% at 55% 112%,#2342d8 0,transparent 70%),linear-gradient(#2f6fe0,#2f6fe0)}
/* Hình nền phủ kín cả màn hình, kể cả phía sau dock (không cắt thành hai phần trên/dưới) */
.stage{background-size:cover;background-repeat:no-repeat;background-position:center}
.stage[data-wall="0"]{background:#2f6fe0 url(wallpaper.jpg) center/cover no-repeat}
.stage[data-wall="2"]{background:radial-gradient(65% 55% at 15% 8%,#ffb48a 0,transparent 62%),radial-gradient(60% 60% at 92% 30%,#d55bd8 0,transparent 62%),radial-gradient(90% 70% at 50% 115%,#3a2a9a 0,transparent 70%),linear-gradient(#7b3fb0,#7b3fb0)}
.stage[data-wall="3"]{background:radial-gradient(60% 50% at 20% 5%,#3d5a9e 0,transparent 62%),radial-gradient(55% 60% at 90% 25%,#6a45d6 0,transparent 62%),radial-gradient(90% 70% at 50% 115%,#1a2250 0,transparent 70%),linear-gradient(#0b1026,#0b1026)}
.dim{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none}

/* Màn hình nền */
.desk{position:absolute;inset:0;z-index:0;padding:40px 12px 110px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-end;gap:6px}
.desk.dropping{background:rgba(255,255,255,.1)}
.gbar{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));height:44px;z-index:1;display:flex;align-items:center;gap:10px;padding:0 5px 0 14px;border-radius:999px;background:rgba(255,255,255,.93);box-shadow:0 4px 18px rgba(0,0,0,.28);box-sizing:border-box}
.gbar[hidden]{display:none}
.gbar .gg{width:22px;height:22px;flex:none;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.gbar .gg svg{width:20px;height:20px}
.gbar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#202124;font-size:15px;user-select:text;-webkit-user-select:text}
.gbar input::placeholder{color:#5f6368}
.gbar .gm{width:34px;height:34px;border:0;border-radius:50%;background:none;display:grid;place-items:center;flex:none;cursor:pointer;padding:0}
.gbar .gm:active{background:rgba(0,0,0,.1)}
.gbar .gm[hidden]{display:none}
.gbar .gs{width:34px;height:34px;border:0;border-radius:50%;background:#4285f4;color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.stage.gbon .desk{padding-top:96px}
.di{width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:10px;color:#fff;text-align:center}
.di .dl{max-width:100%;padding:1px 6px;border-radius:5px;font-size:12px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.6);word-break:break-word}
.di[aria-selected="true"]{background:rgba(255,255,255,.2)}
.di[aria-selected="true"] .dl{background:var(--accent);text-shadow:none}
.di .rn{width:100%;border:0;border-radius:4px;padding:1px 4px;font-size:12px;text-align:center;background:#fff;color:#1d1d1f}
/* Icon ứng dụng trên màn hình desktop (cuộn ngang nếu nhiều) */
.desk{overflow-x:auto;overflow-y:hidden;align-content:flex-start;scrollbar-width:none;overscroll-behavior:contain}
.desk::-webkit-scrollbar{display:none}
.da{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px;color:#fff;text-align:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.da .ic{width:52px;height:52px}
.da .fic{--u:11px;margin-top:2px}
.dthumb{position:relative;display:block;width:52px;height:52px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 2px 8px rgba(0,0,0,.3)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dthumb[data-k=vid]::after{content:'▶';position:absolute;right:4px;bottom:3px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#desk.dropdesk{outline:2px dashed rgba(255,255,255,.65);outline-offset:-8px}
.da .dl{max-width:100%;padding:1px 4px;border-radius:5px;font-size:11.5px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6);word-break:break-word}
.da:hover,.da:focus-visible{background:rgba(255,255,255,.16);outline:0}
/* Lưới ô cố định: mọi icon cùng cỡ ô nên cột và hàng luôn thẳng; tên dài tối đa 2 dòng */
.desk{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:84px;gap:4px 6px;align-content:start;justify-content:start;flex-wrap:nowrap}
.da{width:84px;height:98px;box-sizing:border-box;justify-content:flex-start;touch-action:none}
.da .dl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.dghost{position:absolute;z-index:30;pointer-events:none;opacity:.92;transform:scale(1.1);background:rgba(255,255,255,.18);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.da.dmov{opacity:.28}
.da.dsel{background:rgba(110,165,255,.38);box-shadow:0 0 0 1.5px rgba(170,205,255,.9) inset}
.snapprev{position:absolute;z-index:9990;border-radius:10px;background:rgba(110,165,255,.22);border:2px solid rgba(150,195,255,.85);pointer-events:none;transition:left .12s,top .12s,width .12s,height .12s}
.mqbox{position:fixed;z-index:99999;border:1px solid #6aa7ff;background:rgba(80,140,255,.22);pointer-events:none;border-radius:3px}
.da.dtgt{background:rgba(255,255,255,.28);box-shadow:0 0 0 2px rgba(255,255,255,.55) inset}
.mcbg{position:absolute;inset:0;z-index:1;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
.stage.mc .mcbg{background:rgba(0,0,0,.42);pointer-events:auto}
.mcsp{position:absolute;top:36px;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.mcnone{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px}
.mcl{position:absolute;z-index:1;color:#fff;text-align:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* Thanh menu */
.menubar{position:absolute;inset:0 0 auto 0;height:28px;z-index:6;display:flex;align-items:center;gap:2px;padding-inline:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);font-size:13px;white-space:nowrap;background:linear-gradient(rgba(0,0,0,.16),transparent)}
.mb,.sb{height:22px;padding-inline:9px;border-radius:6px;display:flex;align-items:center;gap:6px}
.mb:hover,.mb.open,.sb:hover,.sb.open{background:rgba(255,255,255,.22)}
.mb.logo{padding-inline:8px}
.sb{padding-inline:7px}
.mb svg,.sb svg{width:16px;height:16px;fill:currentColor;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.appname{font-weight:700}
.sb.off svg{opacity:.45}
#bt svg{width:11px;height:11px}   /* hình Bluetooth cao hết khung 16 nên thu lại để nhìn cao bằng biểu tượng Wi-Fi */
.clk{font-variant-numeric:tabular-nums;gap:7px;padding-inline:8px}
.bram,.bpct{font-size:12px;font-variant-numeric:tabular-nums}
.bram:empty{display:none}
@media (max-width:560px){.opt{display:none}}

.pop{position:absolute;top:30px;z-index:7;min-width:230px;padding:6px;border-radius:12px;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;text-shadow:none;font-size:13px}
#ctx{z-index:14}
.mn{text-align:left;padding:4px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:24px}
.mn:hover:not(:disabled),.mn:focus-visible{background:var(--menu-hi);color:#fff;outline:0}
.mn:disabled{opacity:.4}
.kh{opacity:.6;font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px;width:calc(100% - 8px)}

/* Trung tâm điều khiển */
.cc{position:absolute;top:32px;right:8px;z-index:7;width:min(300px,calc(100% - 16px));padding:12px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr 1fr;gap:10px;text-shadow:none}
.tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--field);text-align:left;min-width:0}
.tile .ci{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(120,120,128,.4);color:#fff;flex:none}
.tile .ci svg{width:17px;height:17px;fill:currentColor}
.tile[aria-pressed="true"] .ci{background:var(--accent)}
.tile b{display:block;font-weight:600;line-height:1.2}
.tile small{color:var(--muted);font-size:11.5px}
.slide{grid-column:1/-1;padding:10px 12px;border-radius:16px;background:var(--field)}
.slide b{display:block;font-weight:600;margin-bottom:6px}
.slide input{width:100%;accent-color:var(--accent);margin:0}
.npr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.npr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.npb{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.npb svg{width:14px;height:14px;fill:currentColor}

/* Thông báo */
.nc{position:absolute;top:30px;right:8px;bottom:8px;z-index:7;width:min(340px,calc(100% - 16px));overflow:auto;padding:14px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 16px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;text-shadow:none}
.nch{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.nlist{display:flex;flex-direction:column;gap:8px}
.nit,.bn{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;background:var(--field);text-align:left;width:100%}
.nit .ic,.bn .ic{width:34px;height:34px;flex:none}
.nit span,.bn span{display:flex;flex-direction:column;min-width:0}
.nit small,.bn small{color:var(--muted);font-size:11.5px}
.nit em,.bn em{font-style:normal;color:var(--fg);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wg{background:var(--field);border-radius:18px;padding:12px;min-width:0}
.wg:first-child{grid-column:1/-1}
.wg small{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.04em}
.wg>b{display:block;font-size:17px;margin:2px 0 6px}
.wg ul{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.wg li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg p{margin:6px 0 0;color:var(--muted)}
.mc7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.mc7 span{color:var(--muted)}
.mc7 i{font-style:normal;padding:2px 0}
.mc7 i.td{background:#ff3b30;color:#fff;border-radius:50%;font-weight:700}
.banners{position:absolute;top:34px;right:10px;z-index:9;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 20px));pointer-events:none}
.bn{pointer-events:auto;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 12px 30px rgba(0,0,0,.3);border-radius:20px;animation:bnin .38s cubic-bezier(.2,.9,.3,1)}
.bn.out{opacity:0;transform:translateX(40px);transition:opacity .3s,transform .3s}
@keyframes bnin{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

/* Spotlight */
.spot{position:absolute;z-index:8;left:50%;top:16%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));border-radius:26px;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 0 0 1px var(--glass-line) inset,0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.sin{display:flex;align-items:center;gap:12px;padding:14px 18px}
.sin svg{width:22px;height:22px;fill:var(--muted);flex:none}
.sin input{flex:1;min-width:0;background:none;border:0;font-size:22px;font-weight:300;outline:0}
.sres{border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column}
.sres:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;text-align:left;width:100%}
.sr[aria-selected="true"],.sr:hover:not(.nores){background:var(--accent);color:#fff}
.sr .ic{width:34px;height:34px;border-radius:8px;flex:none}
.sr small{margin-left:auto;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.sr .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .sf{display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;overflow:hidden}
.nores{color:var(--muted);justify-content:center}

/* Launchpad */
.lp{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;padding:56px 24px 28px;background:rgba(10,14,30,.42);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);animation:lpin .18s ease-out;will-change:opacity}
.lp.out{opacity:0;transition:opacity .16s}
@keyframes lpin{from{opacity:0}to{opacity:1}}
.lpq{display:flex;align-items:center;gap:8px;width:min(260px,100%);height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}
.lpq svg{width:14px;height:14px;flex:none}
.lpq input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff}
.lpq input::placeholder{color:rgba(255,255,255,.7)}
.lpg{overscroll-behavior:contain;flex:1;width:min(860px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));align-content:start;justify-items:center;gap:26px 10px;overflow:auto;min-height:0;padding:24px 0 36px;-webkit-overflow-scrolling:touch}
.lpi{content-visibility:auto;contain-intrinsic-size:96px 100px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:12.5px;padding:6px;border-radius:14px}
.lpi .ic{width:64px;height:64px}

/* Chuyển ứng dụng, Xem nhanh */
.sw{position:absolute;z-index:13;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;padding:14px;border-radius:26px;background:var(--glass);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);box-shadow:0 0 0 1px var(--glass-line) inset,0 20px 50px rgba(0,0,0,.4);max-width:calc(100% - 20px);overflow:auto}
.swi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;color:var(--fg);font-size:12px;min-width:76px}
.swi .ic{width:56px;height:56px}
.swi[aria-current="true"]{background:var(--sel)}
.ql{position:absolute;inset:0;z-index:14;display:grid;place-items:center;background:rgba(0,0,0,.28)}
.qlp{width:min(340px,calc(100% - 32px));padding:28px 20px 20px;border-radius:24px;background:var(--glass);color:var(--fg);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);box-shadow:0 0 0 1px var(--glass-line) inset,0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qli{--u:20px;margin-bottom:10px;height:calc(var(--u)*5);display:grid;place-items:center}
.qlp b{font-size:15px;word-break:break-word}
.qlp span,.qlp small{color:var(--muted)}
.qlp em{font-style:normal;font-size:11.5px;color:var(--muted);margin-top:10px}

/* Màn hình khóa và nguồn */
.lock{position:absolute;inset:0;z-index:40;color:#fff;display:flex;flex-direction:column;align-items:center;padding:7% 20px 22px;background:rgba(10,14,34,.5);backdrop-filter:blur(48px) saturate(1.4);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.4);text-shadow:0 1px 6px rgba(0,0,0,.25)}
.lock.out{opacity:0;transform:translateY(-36px) scale(1.04);transition:opacity .4s,transform .4s}
.lt{font-size:min(96px,20vw);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.ld{font-size:19px;margin-top:6px;opacity:.9}
.lu{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.lav{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#8fa8ff,#7a5cd6);display:grid;place-items:center;font-size:34px;font-weight:300;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.ln{font-size:17px;font-weight:600}
.lu form{display:flex;align-items:center;gap:6px;width:min(230px,80vw);height:34px;padding:0 4px 0 14px;border-radius:999px;background:rgba(255,255,255,.22);text-shadow:none}
.lu input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff}
.lu input::placeholder{color:rgba(255,255,255,.75)}
.go{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center}
.go svg{width:14px;height:14px}
.lh{font-size:11.5px;opacity:.7;text-align:center;max-width:260px}
.lpw{display:flex;gap:26px;margin-top:22px}
.pb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.pbi{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.pbi svg{width:18px;height:18px;fill:currentColor}
#off.off,div.off{position:absolute;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.off[data-mode="sleep"]{cursor:pointer}
.offs{color:rgba(255,255,255,.55);font-size:13px}
.pwr{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pwr svg{width:26px;height:26px}
.blogo svg{width:64px;height:64px;fill:#fff}
.bbar2{width:190px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.bbar2 i{display:block;height:100%;width:0;background:#fff;transition:width 2.2s ease-in-out}

/* Cửa sổ */
.wins{position:absolute;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;pointer-events:auto;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22)}
.win::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);pointer-events:none;z-index:9}
.win.focus{box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 28px 70px rgba(0,0,0,.45)}
.win.min{display:none}
.win.max{border-radius:0}
.win.snapped{border-radius:0}
.tb{position:absolute;inset:0 0 auto 0;height:52px;z-index:2;touch-action:none}
.tls{position:absolute;left:18px;top:19px;z-index:10;display:flex;gap:8px}
.win .tls{display:none!important}
.nobar{display:none!important}
.tl{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1;font-weight:800;color:rgba(0,0,0,.6);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.tl.c{background:#ff5f57}.tl.m{background:#febc2e}.tl.z{background:#28c840}
.tls:hover .tl{color:rgba(0,0,0,.55)}
.win:not(.focus) .tl{background:rgba(150,150,158,.6)}
.body{flex:1;min-height:0;position:relative;container-type:inline-size;overflow:hidden}
.rz{position:absolute;z-index:8;display:block}
.rz[data-d="r"]{top:52px;right:0;bottom:14px;width:6px;cursor:ew-resize}
.rz[data-d="l"]{top:52px;left:0;bottom:14px;width:6px;cursor:ew-resize}
.rz[data-d="b"]{left:14px;right:14px;bottom:0;height:6px;cursor:ns-resize}
.rz[data-d="br"]{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.stage.mc .win,.stage.mcx .win{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.stage.mc .win{cursor:pointer}
.stage.mc .win *{pointer-events:none}
.win.dark-win{color:#f4f4f7}
.ghost{position:absolute;z-index:60;padding:4px 10px;border-radius:8px;background:var(--glass);color:var(--fg);box-shadow:0 0 0 1px var(--glass-line) inset,0 6px 18px rgba(0,0,0,.3);pointer-events:none;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropping{outline:2px solid var(--accent);outline-offset:-2px}
.dk.dropping{outline:0}
.dk.dropping .ic{box-shadow:0 0 0 3px var(--accent)}

/* Thành phần chung */
.app{display:flex;flex-direction:column;height:100%;background:var(--win)}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding-inline:16px;touch-action:none}
.app>.bar{padding-left:78px;background:var(--hdr)}
.bar .t{font-weight:700;font-size:14px}
.cn{font-size:12px;color:var(--muted);font-weight:400}
.btn{padding:5px 14px;border-radius:999px;background:var(--field);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(.94)}
.btn.pri{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover:not(:disabled){background:var(--field)}
.ib:disabled{opacity:.35}
.rf .rbk{width:52px;height:52px;font-size:40px;line-height:1;font-weight:500}
.ib svg,.nv svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"] svg{fill:#ff3b5c;stroke:#ff3b5c}
.nv{display:flex;border-radius:999px;background:var(--field);overflow:hidden;flex:none}
.nv button{min-width:32px;height:28px;display:grid;place-items:center;padding-inline:4px}
.nv button:disabled{opacity:.3}
.nv button[aria-pressed="true"]{background:var(--sel)}
.nv.nf{display:grid;place-items:center;width:32px;height:28px;padding:0}
.nv.nf:disabled{opacity:.3}
.tg{width:38px;height:22px;border-radius:11px;background:rgba(120,120,128,.4);position:relative;transition:background .15s;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tg[aria-checked="true"]{background:#34c759}
.tg[aria-checked="true"] i{transform:translateX(16px)}
.side{background:var(--side);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);padding:56px 10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side h4{margin:6px 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.si{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;text-align:left;width:100%}
.si svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.si .sq{width:20px;height:20px;border-radius:6px;background:var(--c);flex:none;display:grid;place-items:center}
.si .sq svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:1.9}
.si[aria-current="true"]{background:var(--sel)}
/* Cột trái của Tệp / Tải xuống / Ảnh: chữ và biểu tượng to hơn; tiêu đề "Thư viện" kéo sát lên trên (hàng tiêu đề cửa sổ đã ẩn nên không cần chừa 56px) */
.rf .side,.ph .side{padding:14px 10px 10px;gap:4px}
.ph .side h4{margin:0 10px 8px;font-size:22px;font-weight:700;color:var(--fg)}
.rf .si,.ph .si{gap:12px;padding:11px 12px;border-radius:12px;font-size:17px;font-weight:500}
.rf .si .sq,.ph .si .sq{width:30px;height:30px;border-radius:9px}
.rf .si .sq svg,.ph .si .sq svg{width:20px;height:20px}
.rf .si svg,.ph .si svg{width:24px;height:24px}
.rf .si .sq svg,.ph .si .sq svg{width:20px;height:20px}
.si .cnt{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
.foot{padding:7px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;flex:none}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;opacity:.7}
.rn{border:0;border-radius:4px;padding:1px 4px;background:var(--win);color:var(--fg);box-shadow:0 0 0 2px var(--accent);min-width:0}

/* Biểu tượng tệp */
.fic{--u:10px;display:block;position:relative;flex:none}
.fic.doc{width:calc(var(--u)*4);height:calc(var(--u)*5);background:#fff;border-radius:calc(var(--u)*.4);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.18);overflow:hidden}
.fic.doc i{position:absolute;top:0;right:0;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);background:linear-gradient(225deg,rgba(0,0,0,.14) 50%,#eee 50%)}
.fic.doc b{position:absolute;left:0;right:0;bottom:calc(var(--u)*.7);text-align:center;font-size:calc(var(--u)*.9);line-height:calc(var(--u)*1.5);color:#fff;background:var(--c);font-weight:800;letter-spacing:.03em}
.fic.folder,.fic.disk{width:calc(var(--u)*5);height:calc(var(--u)*4.2)}
.fic.folder svg,.fic.disk svg{width:100%;height:100%;display:block}
.row .fic{--u:5.4px;margin-inline:auto}
.cell .fic,.di .fic{--u:11px}

/* Tệp */
.fin{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}
.main>.bar{padding-inline:14px}
.sf{display:flex;align-items:center;gap:6px;height:28px;padding-inline:10px;border-radius:999px;background:var(--field);width:150px;min-width:0}
.sf svg{width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.sf input{background:none;border:0;outline:0;min-width:0;width:100%}
.fl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.fl:focus-visible{outline:0}
.chd,.row{display:grid;grid-template-columns:36px minmax(0,1fr) 150px 74px;align-items:center;gap:8px}
.chd{padding:5px 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
.chd span:first-child{grid-column:1/3}
.rows{padding:6px 10px;flex:1}
.row{width:100%;padding:3px 12px;border-radius:8px}
.rows .row:nth-child(even){background:var(--row)}
.row[aria-selected="true"]{background:var(--accent)!important;color:#fff}
.row[aria-selected="true"] .dt,.row[aria-selected="true"] .sz{color:rgba(255,255,255,.85)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt,.sz{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sz{text-align:right}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:14px;align-content:start;flex:1}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;text-align:center;min-width:0}
.cell[aria-selected="true"]{background:var(--sel)}
.cell .nm{white-space:normal;word-break:break-word;font-size:12px;padding:1px 6px;border-radius:5px;max-width:100%}
.cell[aria-selected="true"] .nm{background:var(--accent);color:#fff}
@container (max-width:470px){
  .fin{grid-template-columns:128px minmax(0,1fr)}
  .chd,.row{grid-template-columns:36px minmax(0,1fr) 62px}
  .chd .dt,.row .dt{display:none}
  .sf{width:104px}
}

/* Lịch */
.cal{position:relative}
.cal-bar .t{font-size:20px;font-weight:300;white-space:nowrap}
.cal-bar .t b{font-weight:700}
.cnav{display:flex;border-radius:999px;background:var(--field);overflow:hidden}
.cnav button{height:28px;padding-inline:12px;display:grid;place-items:center}
.cnav button+button{border-left:1px solid var(--line)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.wk span{padding:4px 8px;text-align:right}
.cg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}
/* Lịch: tiêu đề tháng và nút ‹ Hôm nay › luôn hiện đủ, không bị khuất */
.cal>.bar.cal-bar{min-width:0;gap:6px;padding-right:12px;padding-left:86px}
@media (pointer:coarse){.cal>.bar.cal-bar{padding-left:116px}}
.cal-bar .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:clamp(14px,4.2vw,20px)}
.cal-bar .grow{display:none}
.cnav{flex:none}
.cnav button{padding-inline:10px}
.cal>.wk,.cal>.cg{min-width:0}
.cal>.cg{min-height:120px}

.cd{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-variant-numeric:tabular-nums;overflow:hidden;position:relative}
.cd:nth-child(7n+1){border-left:0}
.cd:nth-child(-n+7){border-top:0}
.cd:hover{background:var(--row)}
.cd.o{color:var(--muted);opacity:.6}
.cd.e{pointer-events:none;background:rgba(127,127,127,.06)}
.cd.e:hover{background:rgba(127,127,127,.06)}
.cd i{font-style:normal;font-size:var(--fs,13px);min-width:1.6em;height:1.6em;border-radius:.8em;display:grid;place-items:center;padding-inline:.12em;flex:none;line-height:1}
.cd .lu{margin:-2px 0 2px!important;display:block;font-size:var(--ls,10px);color:var(--muted);line-height:1;font-variant-numeric:tabular-nums;flex:none}
.cd .lu.l1{color:#ff3b30;font-weight:600}
.evp .lud{display:block;margin:2px 0 6px;font-size:11px;color:var(--muted)}
.cd.today i{background:#ff3b30;color:#fff;font-weight:700}
.chip{align-self:stretch;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;background:rgba(10,122,255,.18);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chip.more{background:none;color:var(--muted)}
.dotev{display:none;width:5px;height:5px;border-radius:50%;background:var(--accent)}
@container (max-width:520px){.chip{display:none}.dotev{display:block}}
/* Lịch: chỉ hiện ngày của tháng đang xem; cỡ số tự co giãn theo ô (JS đặt --fs, --ls) */
.cg.wide .cd{flex-direction:row-reverse;align-items:center;justify-content:flex-start;gap:6px;padding:2px 8px}
.cg.wide .cd .lu{margin:0!important}
.cg.wide .chip{display:none!important}
.cg.wide .dotev{display:block!important;position:absolute;left:7px;top:50%;margin-top:-2.5px}
.cg:not(.wide) .cd{padding-top:6px}
@container (max-width:520px){
  .cal-bar .t{font-size:13px;white-space:normal;line-height:1.15;overflow:visible}
  .cal-bar .t b{display:block;font-size:16px}
  .cal .cnav button{padding-inline:8px;font-size:13px;white-space:nowrap}
}
.cal .cnav button{white-space:nowrap}
.evp{position:absolute;z-index:6;width:240px;padding:12px;border-radius:16px;background:var(--glass);backdrop-filter:blur(var(--bl)) saturate(1.8);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.8);box-shadow:0 0 0 1px var(--glass-line) inset,0 12px 30px rgba(0,0,0,.3)}
.evp ul{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.evp li{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;background:rgba(10,122,255,.14)}
.evp li button{opacity:.6}
.evp form{display:flex;gap:6px}
.evp input{flex:1;min-width:0;border:0;border-radius:8px;padding:5px 8px;background:var(--field);outline:0}

/* Ghi chú */
.nts{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.nl{background:var(--side);backdrop-filter:blur(var(--bl)) saturate(1.9);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.9);display:flex;flex-direction:column;min-height:0}
.nl .bar{padding-left:78px}.nl .bar .t{white-space:nowrap}
.ned .sv{height:28px;padding:0 12px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;flex:none}
.ned .sv.ok{background:#28c840}
.nlst{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.nt{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:9px;text-align:left}
.nt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt i{font-style:normal;color:var(--fg);opacity:.7}
.nt[aria-current="true"]{background:#ffd54a;color:#1d1d1f}
.nt[aria-current="true"] span{color:rgba(0,0,0,.65)}
.ned{display:flex;flex-direction:column;background:var(--win);min-width:0}
.ned .bar{padding-inline:14px}
.ned textarea{flex:1;min-height:0;resize:none;border:0;background:transparent;color:inherit;font:15px/1.65 var(--font);padding:4px 22px 18px;user-select:text;-webkit-user-select:text}
.ned textarea:focus-visible{outline:0}
@container (max-width:520px){.nts{grid-template-columns:150px minmax(0,1fr)}.nl .bar{padding-left:78px}}

.rc{font-size:30px;color:var(--accent)}

/* Máy tính */
.calc{--bh:44px;position:relative;container-type:size;display:flex;flex-direction:column;height:100%;background:rgba(28,28,31,.97);padding:0 10px 10px;gap:8px}
.calc .bar{height:var(--bh);padding-inline:0;display:flex;align-items:center;justify-content:flex-end;flex:none}
.hbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.expr{min-height:1.3em;padding:0 10px;text-align:right;font-size:clamp(15px,3.6cqh,28px);color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;margin-top:auto}
.disp{flex:0 0 auto;min-height:56px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 2px;font-size:46px;line-height:1.1;font-weight:300;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;color:#fff}
.disp span{display:block}
.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;flex:0 0 50cqh;min-height:0}
.k{height:auto;min-height:0;border-radius:999px;background:#505055;color:#fff;font-size:17px;display:grid;place-items:center}
.k:active{filter:brightness(1.4)}
.k.fn{background:#a5a5ab;color:#111}
.k.op{background:#ff9f0a}
.k.op.on{background:#fff;color:#ff9f0a}
.k.wide{grid-column:span 2;justify-content:start;padding-left:19px}
.chist{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:var(--bh) 12px 12px;background:rgba(28,28,31,.99);color:#fff}
.chist[hidden]{display:none}
.chh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px;border-bottom:1px solid rgba(255,255,255,.14)}
.chh b{font-size:16px}
.chh span{display:flex;gap:8px}
.chh button{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px}
.chl{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none}
.chl li{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;cursor:pointer}
.chl li:active{background:rgba(255,255,255,.08)}
.chl small{display:block;color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
.chl em{display:block;font-style:normal;font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;word-break:break-all}
.chl .non{text-align:center;color:rgba(255,255,255,.5);padding:30px 0;border:0;cursor:default}
/* Cửa sổ thấp (màn hình ngang): thu gọn để không bị Dock che */
@container (max-height:340px){
  .calc{--bh:36px;gap:4px;padding:0 8px 8px}
  .keys{flex:1;min-height:0;grid-template-rows:repeat(5,minmax(0,1fr));gap:4px}
  .k{height:auto;min-height:0;font-size:15px;border-radius:999px}
  .k.wide{padding-left:16px}
  .disp{min-height:0}
  .hbtn{width:28px;height:28px}
}
/* Vừa thấp vừa rộng: màn hình trái, phím phải */
@container (max-height:340px) and (min-width:440px){
  .calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:12px;row-gap:2px}
  .calc .bar{grid-column:1;grid-row:1}
  .expr{grid-column:1;grid-row:2;align-self:end;margin-top:0}
  .disp{grid-column:1;grid-row:3}
  .keys{grid-column:2;grid-row:1/4}
}


/* Báo thức */
.alm{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
.whl{position:relative;isolation:isolate;display:flex;justify-content:center;align-items:center;gap:6px;height:120px}
.wcol{width:84px;height:120px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;box-sizing:border-box;scrollbar-width:none;-webkit-overflow-scrolling:touch;text-align:center}
.wcol::-webkit-scrollbar{display:none}
.wi{height:40px;line-height:40px;font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;scroll-snap-align:center;color:var(--muted);cursor:pointer}
.wi.on{color:var(--fg);font-weight:400}
.wsep{font-size:28px;font-weight:300}
.wband{position:absolute;left:50%;top:40px;width:230px;height:40px;transform:translateX(-50%);border-radius:12px;background:rgba(127,127,127,.18);pointer-events:none;z-index:-1}
.alr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--field)}
.als b{display:block;margin:0 4px 6px}
.als ul{list-style:none;margin:0;padding:0;border-radius:12px;background:var(--field);overflow:hidden}
.als li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.als li:first-child{border-top:0}
.als li.non{justify-content:center;color:var(--muted);cursor:default}
.snl{max-height:150px;overflow:auto}
.snl .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snl li{justify-content:center;position:relative}
.snl .sn{flex:none;max-width:calc(100% - 64px);text-align:center}
.snl .rd{position:absolute;left:14px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);flex:none}
.snl li[aria-selected="true"] .rd{box-shadow:inset 0 0 0 5px var(--accent)}
.snl .apv{width:30px;height:30px;border-radius:50%;background:var(--win);font-size:12px}
.aset{align-self:center;padding:9px 28px;font-size:15px}
.all li{cursor:default}
.all .at{flex:1;font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;min-width:0}
.all .at small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all .adl{width:28px;height:28px;flex:none;border-radius:50%;background:var(--win);color:var(--muted);display:grid;place-items:center;padding:0;line-height:0}
.all .adl svg{display:block;pointer-events:none}


/* Mật khẩu màn hình */
.lock{overflow:auto}
.amsg{min-height:18px;font-size:13px;opacity:.9;margin-bottom:6px;text-align:center}
.amsg.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.apw{display:flex;align-items:center;gap:6px;width:min(240px,80vw);height:36px;padding:0 4px 0 14px;border-radius:999px;background:rgba(127,127,127,.28);margin:0 auto;text-shadow:none}
.apw input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit}
.adots{display:flex;gap:12px;justify-content:center;height:16px;margin:4px 0 12px}
.adots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.adots i.f{background:currentColor}
.apad{display:grid;grid-template-columns:repeat(3,56px);gap:10px 16px;justify-content:center}
.apad button{width:56px;height:56px;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;font-size:22px;display:grid;place-items:center;text-shadow:none}
.apad button:active{background:rgba(127,127,127,.55)}
.apad .nb{background:none;font-size:18px}
.apat{width:min(210px,42vh,70vw);margin:0 auto;touch-action:none}
.apat svg{width:100%;height:auto;display:block;touch-action:none}
@media (max-height:430px){.apad{grid-template-columns:repeat(3,42px);gap:6px 12px}.apad button{width:42px;height:42px;font-size:18px}}

/* Cài đặt */
.sset{display:grid;grid-template-columns:210px minmax(0,1fr);height:100%}
.pane{padding:6px 22px 22px;overflow:auto;flex:1;min-height:0}
.pane h2{margin:0 0 14px;font-size:20px}
.grp{background:var(--field);border-radius:12px;overflow:hidden}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw small{display:block;color:var(--muted)}
.rc2{display:flex;align-items:center}
.rg{width:150px;accent-color:var(--accent)}
.stp{flex:none;width:28px;height:28px;margin:0 6px;border:0;border-radius:50%;background:var(--field);color:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stp:active{background:var(--accent);color:#fff}
.txt{border:0;border-radius:8px;padding:5px 9px;background:var(--win);color:var(--fg);outline:0;width:150px}
.tiles{display:flex;gap:14px;flex-wrap:wrap}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ap .th{width:84px;height:58px;border-radius:10px;box-shadow:0 0 0 1px var(--line);display:block}
.ap[aria-pressed="true"] .th,.ap[aria-pressed="true"] .wl{box-shadow:0 0 0 3px var(--accent)}
.ap[aria-pressed="true"]>span:last-child{font-weight:600}
.th.a{background:linear-gradient(115deg,#f2f3f7 50%,#2a2b31 50%)}
.th.l{background:#f2f3f7}
.th.d{background:#2a2b31}
.wl{width:96px;height:62px;border-radius:10px;box-shadow:0 0 0 1px var(--line);display:block}
.wl.w0{background:#2f6fe0 url(wallpaper.jpg) center/cover no-repeat}
.w1{background:linear-gradient(135deg,#9be8ff,#8aa8ff 50%,#2342d8)}
.w2{background:linear-gradient(135deg,#ffb48a,#d55bd8 50%,#3a2a9a)}
.w3{background:linear-gradient(135deg,#3d5a9e,#6a45d6 50%,#0b1026)}
@container (max-width:520px){.sset{grid-template-columns:150px minmax(0,1fr)}.rg,.txt{width:110px}}
.abt{align-items:center;padding:38px 24px 20px;text-align:center}
.logo-big{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#9be8ff,#2342d8);display:grid;place-items:center;box-shadow:0 8px 22px rgba(35,66,216,.4)}
.logo-big svg{width:46px;height:46px;fill:#fff}
.abt h2{margin:14px 0 0;font-size:22px}
.abt p{margin:2px 0 14px;color:var(--muted)}
.abt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:12.5px;margin:0}
.abt dt{color:var(--muted);text-align:right}
.abt dd{margin:0}
.fq .fqh{margin:0;padding:6px 20px 10px;color:var(--muted)}
.fql{flex:1;overflow:auto;margin:0 16px;border-radius:12px;background:var(--field);padding:6px}
.fqr{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;width:100%}
.fqr .ic{width:28px;height:28px}
.fqr[aria-pressed="true"]{background:var(--accent);color:#fff}
.fqf{padding:12px 16px;display:flex;justify-content:flex-end;gap:8px}

/* Trình duyệt */
.br .bbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 78px;background:var(--hdr)}
.addr{flex:1;max-width:520px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--field);min-width:0}
.addr svg{width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.addr input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:center}
.addr input:focus{text-align:left}
.tabs{display:flex;gap:6px;padding:4px 12px;background:var(--hdr);border-bottom:1px solid var(--line);overflow-x:auto}
.tb2{display:flex;align-items:center;flex:1;max-width:200px;min-width:90px;border-radius:8px;padding:0 4px 0 10px;height:26px}
.tb2[aria-current="true"]{background:var(--field)}
.tb2 .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.tb2 .tx{padding-inline:4px;opacity:.5}
.pg{flex:1;overflow:auto;user-select:text;-webkit-user-select:text}
.bst{max-width:640px;margin:0 auto;padding:30px 20px}
.bst h1{margin:0 0 16px;font-size:26px;font-weight:600;word-break:break-word}
.bst h3{margin:22px 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.bsf input{width:100%;border:0;border-radius:12px;padding:10px 14px;background:var(--field);outline:0;font-size:15px}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}
.fv{display:flex;flex-direction:column;align-items:center;gap:6px;color:inherit;text-decoration:none;font-size:12px}
.fv i{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:24px;font-weight:700}
.note{color:var(--muted);font-size:12px;margin-top:22px}
.lks{display:flex;gap:16px;margin-top:8px}
.hl{display:flex;flex-direction:column;gap:6px}
.hl small{color:var(--muted)}
.sbtn{display:flex;gap:10px;flex-wrap:wrap}
a.btn{color:inherit;text-decoration:none}
a.btn.pri{color:#fff}

/* Thư */
.ml{display:grid;grid-template-columns:190px minmax(0,1fr);height:100%;position:relative}
.mmain{display:flex;flex-direction:column;background:var(--win);min-width:0;min-height:0}
.mmain>.bar{padding-inline:14px}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr)}
.mls{overflow:auto;border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:2px}
.mi2{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;text-align:left;min-width:0}
.mi2[aria-current="true"]{background:var(--accent);color:#fff}
.mf{display:flex;align-items:center;gap:6px;font-weight:600}
.mf i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

.mf em{margin-left:auto;font-style:normal;font-weight:400;font-size:12px;opacity:.7}
.mi2 b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi2.un b{font-weight:700}
.mp{font-size:12px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrd{overflow:auto;padding:16px 20px;user-select:text;-webkit-user-select:text}
.mh2{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mh2>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mh2 b{font-size:16px}
.mh2 span,.mh2 small{color:var(--muted)}
.mb2{display:none}
.mtx{padding-top:14px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.mbx{display:none}
.cmp{position:absolute;inset:0;z-index:6;background:var(--glass);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));display:grid;place-items:center;padding:12px}
.cf{width:min(520px,100%);height:min(380px,100%);background:var(--win);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.cfh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cf label{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--muted)}

.cf .err{box-shadow:0 0 0 2px #ff3b30;border-radius:4px}

@container (max-width:640px){
  .ml{grid-template-columns:minmax(0,1fr)}
  .msd{display:none}
  .mmain>.bar{padding-left:78px}
  .mbx{display:flex}
  .mbody{grid-template-columns:minmax(0,1fr)}
  .mrd{display:none}
  .ml.rd .mls{display:none}
  .ml.rd .mrd{display:block}
  .mb2{display:grid}
}

.fht{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:0;border-radius:16px;background:var(--row);color:inherit;font:inherit;cursor:pointer}

.mt{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--sel);overflow:hidden;border-radius:6px;cursor:pointer}
.mt img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .18s}
.mt img.ld{opacity:1}
.mdur{position:absolute;right:4px;bottom:3px;font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}

/* Chọn trình duyệt thật */

.bps b{font-size:16px;padding:0 6px}

.bpl{overflow:auto;display:flex;flex-direction:column;gap:2px}
.bpi{display:flex;align-items:center;gap:12px;padding:9px 8px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.bpi:hover,.bpi:active{background:var(--sel)}
.bpi img{width:40px;height:40px;border-radius:22%;object-fit:cover;flex:none}

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const stage=$('#stage'), layer=$('#wins'), dock=$('#dock'), appname=$('#appname'), desk=$('#desk');
const root=document.documentElement;
const origTheme=root.getAttribute('data-theme');
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
/* Ứng dụng ngoài đang mở (Zalo...) -> hiện thẻ trong đa nhiệm */
const EXTK='dm-ext';
let extRun=[]; try{extRun=JSON.parse(lsGet(EXTK)||'[]').filter(x=>x&&x.pkg&&x.pkg!=='com.desktopmini.tvweb')}catch(e){extRun=[]}
const extSave=()=>lsSet(EXTK,JSON.stringify(extRun));
function extLaunch(pkg){
  const A=window.AndroidLauncher; if(!A)return;
  try{A.launchApp(pkg)}catch(e){return}
  try{
    let info=null; if(A.appInfo){const r=A.appInfo(pkg); if(r)info=JSON.parse(r)}
    const old=extRun.find(x=>x.pkg===pkg);
    extRun=extRun.filter(x=>x.pkg!==pkg);
    if(info||old)extRun.unshift(info||old);
    extSave();
  }catch(e){}
}
/* Gộp các app ngoài mở từ Dock nổi (Java ghi lại) vào danh sách đa nhiệm */
function extSync(){
  try{
    const A=window.AndroidLauncher; if(!A||!A.takeExtLaunched)return;
    const arr=JSON.parse(A.takeExtLaunched()||'[]'); if(!arr.length)return;
    const add=[];
    arr.forEach(pkg=>{
      let info=null; try{const r=A.appInfo&&A.appInfo(pkg); if(r)info=JSON.parse(r)}catch(e){}
      const old=extRun.find(x=>x.pkg===pkg); info=info||old; if(info)add.push(info);
    });
    if(!add.length)return;
    extRun=add.concat(extRun.filter(x=>!add.some(a=>a.pkg===x.pkg))); extSave();
  }catch(e){}
}
function extKill(pkg){
  extRun=extRun.filter(x=>x.pkg!==pkg); extSave();
  try{const A=window.AndroidLauncher; if(A&&A.killApp)A.killApp(pkg)}catch(e){}
}
/* Chạy nền: chỉ gỡ khỏi danh sách đa nhiệm / Dock, KHÔNG tắt tiến trình - ứng dụng vẫn chạy ngầm trong máy */
function extBg(pkg){
  extRun=extRun.filter(x=>x.pkg!==pkg); extSave();
  try{const A=window.AndroidLauncher; if(A&&A.forgetExtApp)A.forgetExtApp(pkg)}catch(e){}
}
/* Hỏi: đóng thật (tắt hẳn) hay để chạy nền. fn('kill'|'bg') */
function extAsk(names,fn){ fn('kill'); } /* Mặc định đóng hẳn ứng dụng ngoài, không hỏi nữa */
const extName=id=>(APPS[id]&&APPS[id].name)||id.slice(2);
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>lsSet(k,JSON.stringify(v));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();
const pad=n=>n<10?'0'+n:''+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();
const MONTHS=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const DAYS=['CN','T2','T3','T4','T5','T6','T7'];
const DAYSL=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const bus={l:{},on(e,f){(this.l[e]=this.l[e]||[]).push(f)},emit(e,a){(this.l[e]||[]).forEach(f=>f(a))}};
/* Ghi lỗi JavaScript ra tệp nhật ký (Download/DesktopMini-loi.txt) để chẩn đoán */
window.addEventListener('error',e=>{try{const A=window.AndroidLauncher; if(A&&A.logError)A.logError('error',String(e.message)+' @ '+String(e.filename).split('/').pop()+':'+e.lineno+':'+e.colno)}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{const A=window.AndroidLauncher; if(A&&A.logError)A.logError('promise',String(e.reason&&(e.reason.stack||e.reason)))}catch(x){}});
/* Khung nội dung gốc (WebView/Gecko nhúng) bám theo cửa sổ: bình thường dò mỗi 90ms, còn khi đang kéo/đổi cỡ cửa sổ thì ép đồng bộ ngay mỗi khung hình để không bị trễ, giật */
const NSYNC=new Set(); let nsRaf=0;
function kickSync(){if(nsRaf)return;nsRaf=requestAnimationFrame(()=>{nsRaf=0;NSYNC.forEach(f=>{try{f()}catch(e){}})})}
/* Một bộ đếm chung cho các cửa sổ web nhúng và Gecko (trước đây mỗi cửa sổ có một setInterval 90ms riêng).
   Đang dùng: 90ms/lần như cũ. Desktop Mini ra nền (document.hidden): chỉ thức dậy 1 lần/giây và không làm gì. Hết cửa sổ thì tự dừng. */
/* Cửa sổ web nhúng (YouTube, Gecko...) là view native nằm đè lên HTML nên chỉ hiện được khi cửa sổ ở trên cùng; nếu ẩn thì chỉ còn nền đen.
   Cửa sổ không được chọn nhưng KHÔNG bị cửa sổ nào khác che (kể cả che một phần) thì vẫn cho hiện để không bị đen, và video đang phát không bị tạm dừng; nhiều cửa sổ web nhúng không chồng nhau hiện song song được. */
function winFree(w){
  try{
    const r=w.getBoundingClientRect(); if(r.width<2||r.height<2)return false;
    const zw=+w.style.zIndex||0, E=2; /* E: dung sai vài px — 2 cửa sổ chia đôi chỉ chạm mép nhau thì không tính là che */
    return !$$('.win',layer).some(o=>{
      if(o===w||o.classList.contains('min')||o._leaving)return false;
      /* chỉ cửa sổ nằm TRÊN (z-index cao hơn) mới che được; cửa sổ nằm dưới không che nên không được làm ẩn YouTube/web nhúng */
      if((+o.style.zIndex||0)<zw)return false;
      const q=o.getBoundingClientRect(); if(q.width<2||q.height<2)return false;
      return q.left<r.right-E&&q.right>r.left+E&&q.top<r.bottom-E&&q.bottom>r.top+E;
    });
  }catch(e){return false}
}
let nsTimer=0;
function nsTick(){
  nsTimer=0; if(!NSYNC.size)return;
  if(!document.hidden)NSYNC.forEach(f=>{try{f()}catch(e){}});
  nsTimer=setTimeout(nsTick,document.hidden?1000:90);
}
function nsStart(){if(!nsTimer&&NSYNC.size)nsTimer=setTimeout(nsTick,90)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(nsTimer);nsTimer=0;nsStart();kickSync()}});
/* Bộ hẹn giờ chung cho việc định kỳ (đồng hồ, đồng bộ cài đặt, pin, RAM): 1 setTimeout/giây thay cho 4 setInterval riêng.
   Ra nền hoặc tắt màn hình (document.hidden): dừng hẳn, không gọi cầu Java nữa; quay lại thì chạy bù tất cả ngay. */
const DMEV=[]; let dmEvT=0;
function dmEvTick(){
  dmEvT=0; if(document.hidden)return;
  const now=Date.now();
  DMEV.forEach(t=>{if(now-t.last>=t.ms-50){t.last=now;try{t.fn()}catch(e){}}});
  dmEvT=setTimeout(dmEvTick,1000);
}
function dmEvery(fn,ms){DMEV.push({fn:fn,ms:ms,last:Date.now()}); if(!dmEvT&&!document.hidden)dmEvT=setTimeout(dmEvTick,1000)}

   Tệp js/<tên>.js đặt mã trong một hàm bọc (window.__LZ.<tên>); ta lấy phần thân rồi eval TRỰC TIẾP ở đây để mã chạy trong cùng phạm vi với phần còn lại. */
const LZ={};
function lazyReal(file,fn){
  const st=LZ[file]; if(st.fns)return st.fns;
  const wrap=window.__LZ&&window.__LZ[file]; if(typeof wrap!=='function')throw new Error('thiếu '+file);
  const src=String(wrap);
  st.fns=eval(src.slice(src.indexOf('{')+1,src.lastIndexOf('}'))+'\n;({'+LZFN[file]+'})');
  delete window.__LZ[file];
  return st.fns;
}
const LZFN={calc:'buildCalc',settings:'buildSettings',recorder:'buildRecorder',camera:'buildCamera',browser:'buildBrowser',photos:'buildPhotos',terminal:'buildTerminal',clock:'buildClock'};
function lazyBuild(file,fn,b,w,a){
  let inner=null,dead=false;
  const run=()=>{
    if(dead)return;
    try{inner=lazyReal(file)[fn](b,w,a)||{}}catch(e){console.error(e);b.textContent='Không mở được ứng dụng'}
  };
  const st=LZ[file]||(LZ[file]={ok:false,q:[],loading:false,fns:null});
  if(st.ok)run();

function fitDock(){
  const sw=stage.clientWidth, n=DOCK.filter(x=>x!=='|').length+TEMP.length, seps=DOCK.filter(x=>x==='|').length, tot=DOCK.length+TEMP.length;
  /* chừa chỗ hai bên cho nút tìm kiếm và nút chụp màn hình (mỗi bên rộng bằng 1 icon + 24px) */
  let base=Math.floor((sw-100-(tot-1)*6-seps*8)/(n+2));
  const pc=66; /* Dock ở màn hình chính cố định 66% */
  const ps=Math.round(Math.max(40,Math.min(100,pc))*0.45*100)/100; /* 40–100% của 45px = 18–45px, chỉnh từng 1% */
  /* màn rộng (>560px): cho icon nhỏ tới 30px để Dock vẫn vừa, không chuyển sang chế độ cuộn (chế độ cuộn tắt hiệu ứng phóng đại) */
  const flo=window.matchMedia('(max-width:560px)').matches?44:30;
  base=Math.max(Math.min(flo,ps),Math.min(ps,base));
  try{unmagnify()}catch(e){} /* kích thước đổi thì toạ độ tâm icon cũ không còn đúng */
  stage.style.setProperty('--base',base+'px');
  try{if(window.AndroidLauncher&&AndroidLauncher.setDockBase)AndroidLauncher.setDockBase(Math.round(base))}catch(e){}
  try{$$('.win.max',layer).forEach(fitMax)}catch(e){}   /* cửa sổ phóng to theo kịp chiều cao Dock mới */
  try{$$('.win',layer).forEach(w=>{if(w._snap&&w._snap.side&&!w.classList.contains('max'))snapHalf(w,w._snap.side)})}catch(e){}
  /* cửa sổ thường đang cao hết cỡ (không phóng to/chia đôi): kéo đáy xuống sát Dock mới, hết hở khi Dock thu nhỏ */
  try{const sh=stage.getBoundingClientRect().height; $$('.win',layer).forEach(w=>{if(w._fill&&!w._snap&&!w.classList.contains('max')&&!w.classList.contains('min')){const t=w.offsetTop; w.style.height=Math.max(160,sh-t-dockRes())+'px'}})}catch(e){}   /* cửa sổ chia đôi cũng theo kịp, khỏi hở với Dock */
  /* Nếu vẫn chưa vừa chiều ngang thì chuyển sang chế độ vuốt ngang (Dock vẫn nằm giữa, icon dư bị ẩn) */
  dock.classList.remove('scroll');
  /* tính theo bề rộng cuối cùng của các ô (không đo DOM: ô đang mở rộng/thu lại có bề rộng giữa chừng); mỗi vạch ngăn rộng 1px + lề 2×2px */
  const need=n*base+(tot-1)*6+seps*5+20;
  if(need>sw-2*(base+24)+1)dock.classList.add('scroll'); else dock.scrollLeft=0;
}
function fitCalc(w){
  const sr=stage.getBoundingClientRect(), wide=sr.width>sr.height*1.25, a=APPS.calc;
  const bw=Math.min(wide?Math.max(a.w,460):a.w,sr.width-24), bh=Math.min(a.h,sr.height-28-110);
  w.style.width=bw+'px'; w.style.height=bh+'px';
  w.style.left=Math.max(12,Math.min(w.offsetLeft,sr.width-bw-12))+'px';
  w.style.top=Math.max(40,Math.min(w.offsetTop,sr.height-bh-110))+'px';
}
window.addEventListener('resize',()=>{fitDock();$$('.win.max',layer).forEach(fitMax);$$('.win[data-app="calc"]:not(.max)',layer).forEach(fitCalc)});
let centers=[], mgBase=54, mgRaf=0, mgX=0, mgEls=[];
const narrowDock=()=>window.matchMedia('(max-width:560px)').matches||dock.classList.contains('scroll');
/* Tâm icon tính theo offsetLeft nên không bị ảnh hưởng bởi transform đang phóng đại */
const calcCenters=()=>{
  mgEls=$$('.dk',dock); const dl=dock.getBoundingClientRect().left;
  mgBase=parseFloat(getComputedStyle(stage).getPropertyValue('--base'))||54;
  centers=mgEls.map(d=>dl+d.offsetLeft+d.offsetWidth/2);
};
/* Phóng đại bằng transform (không gây reflow), gộp mỗi khung hình một lần */
const applyMag=()=>{
  mgRaf=0; if(!centers.length)return;
  const sc=centers.map(c=>{const d=mgX-c;return 1+.62*Math.exp(-(d*d)/(2*58*58))});
  const total=sc.reduce((a,v)=>a+(v-1)*mgBase,0);
  let acc=0;
  mgEls.forEach((d,i)=>{
    const ext=(sc[i]-1)*mgBase, dx=acc+ext/2-total/2; acc+=ext;
    d.style.transform='translateX('+dx.toFixed(1)+'px)';
    d.style.setProperty('--lift',ext.toFixed(1)+'px');
    const ic=d.firstElementChild; if(ic)ic.style.transform='scale('+sc[i].toFixed(3)+')';
  });
};
const magnify=e=>{
  return; /* đã bỏ phóng đại khi lướt: bấm icon thì nảy một cái rồi mở app */
  if(dkDragOn||!pref('magnify',true)||narrowDock())return; /* màn hẹp: dock là thanh cuộn ngang, không phóng đại để lướt mượt */
  if(!centers.length)calcCenters();
  if(!centers.length)return;
  dock.classList.add('dmag'); mgX=e.clientX; /* không dùng tên 'mg': trùng với .mg (lưới 92px) làm dock giãn ra hai bên */
  if(!mgRaf)mgRaf=requestAnimationFrame(applyMag);
};
const unmagnify=()=>{
  if(mgRaf){cancelAnimationFrame(mgRaf);mgRaf=0}
  dock.classList.remove('dmag');
  mgEls.forEach(d=>{d.style.removeProperty('transform');d.style.removeProperty('--lift');const ic=d.firstElementChild;if(ic)ic.style.removeProperty('transform')});
  centers=[];
};
/* Chuột: rê qua dock. Màn cảm ứng rộng: chạm giữ rồi trượt ngón tay dọc dock, nhả ra thì thu lại */
dock.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')calcCenters()});
dock.addEventListener('pointerover',e=>{if(e.pointerType!=='touch'&&!centers.length)calcCenters()});
dock.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!narrowDock()){calcCenters();magnify(e)}});
dock.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&!(e.buttons&1))return;magnify(e)},{passive:true});
['pointerup','pointercancel'].forEach(t=>dock.addEventListener(t,e=>{if(e.pointerType==='touch')unmagnify()}));
dock.addEventListener('pointerleave',()=>{unmagnify();if(pref('hideDock',false))dock.classList.remove('peek')});
/* Chống kẹt phóng đại (vuốt qua lại rồi icon bự mãi): thu lại khi ngón tay/chuột nhả hoặc rời khỏi Dock ở bất cứ đâu, và có đồng hồ canh phòng khi mất sự kiện nhả */
let mgDown=false, mgType='';
const mgOff=()=>{if(dock.classList.contains('dmag')||centers.length)unmagnify()};
addEventListener('pointerdown',e=>{mgType=e.pointerType;if(e.pointerType==='touch')mgDown=true},true);
['pointerup','pointercancel','touchend','touchcancel','blur','contextmenu'].forEach(t=>addEventListener(t,e=>{

/* Đổi chỗ icon trên Dock: cảm ứng = nhấn giữ rồi kéo ngang (nhả mà không kéo thì hiện menu); chuột = bấm giữ và kéo. Thứ tự được lưu lại */

const dkCenter=o=>dock.getBoundingClientRect().left+o.offsetLeft-dock.scrollLeft+o.offsetWidth/2;
function dkDragStart(){
  const el=dkH.el; dkH.drag=true; dkDragOn=true; unmagnify(); closeAllPopups();

function dkDragMove(x){
  const el=dkH.el, pinned=$$('.dk',dock).filter(d=>d!==el&&DOCK.indexOf(d.dataset.id)>=0);
  const dr=dock.getBoundingClientRect();
  if(dock.classList.contains('scroll')){if(x<dr.left+34)dock.scrollLeft-=10; else if(x>dr.right-34)dock.scrollLeft+=10}
  let before=null; for(const o of pinned){if(dkCenter(o)>=x){before=o;break}}
  if(before&&before.dataset.id==='launchpad')before=pinned[1]||null; /* Launchpad luôn đứng đầu */
  const last=pinned[pinned.length-1];
  const needMove=before?el.nextElementSibling!==before:(last&&last.nextElementSibling!==el);
  if(needMove){
    const rects=new Map(pinned.map(o=>{o.style.transition='none';return [o,o.getBoundingClientRect().left]}));
    if(before)dock.insertBefore(el,before); else dock.insertBefore(el,last.nextElementSibling);
    pinned.forEach(o=>{o.style.transform='';const d=rects.get(o)-o.getBoundingClientRect().left; if(d)o.style.transform='translateX('+d+'px)'});
    void dock.offsetWidth;
    pinned.forEach(o=>{o.style.transition='transform .18s ease';o.style.transform=''; setTimeout(()=>{o.style.transition=''},220)});
  }

}
function dkEnd(cancel){
  const h=dkH; dkH=null; if(!h)return;
  const el=h.el; el.classList.remove('dkhold');
  setTimeout(()=>{el._lp=false},350);
  if(!h.drag){ if(!h.mouse&&!cancel&&h.menu)h.menu(); return }
  el.style.transition='transform .18s ease'; el.style.transform='';
  setTimeout(()=>{el.style.transition='';el.classList.remove('dkdrag');dock.classList.remove('dkdragging');dkDragOn=false;try{unmagnify()}catch(e){}},200);
  const nl=[]; [...dock.children].forEach(c=>{if(c.classList.contains('sep'))nl.push('|'); else if(c.classList.contains('dk')&&DOCK.indexOf(c.dataset.id)>=0)nl.push(c.dataset.id)});
  if(nl.length===DOCK.length&&nl.every(x=>x==='|'||DOCK.indexOf(x)>=0)){DOCK.length=0; nl.forEach(x=>DOCK.push(x)); saveDock()}
}
addEventListener('pointermove',e=>{
  if(!dkH||e.pointerId!==dkH.pid)return;
  if(!dkH.drag){const dx=e.clientX-dkH.sx, dy=e.clientY-dkH.sy; if(Math.abs(dx)+Math.abs(dy)<(dkH.mouse?7:5))return; dkDragStart()}
  dkDragMove(e.clientX);
});
addEventListener('pointerup',e=>{if(dkH&&e.pointerId===dkH.pid)dkEnd(false)});
addEventListener('pointercancel',e=>{if(dkH&&e.pointerId===dkH.pid)dkEnd(true)});
/* Thanh tìm kiếm Google trên màn hình nền: gõ rồi Enter -> mở ứng dụng Duyệt web với kết quả Google (hoặc mở thẳng địa chỉ nếu gõ tên trang web) */
(function(){
  const bar=$('#gbar'), gq=$('#gq');
  function go(){
    const q=gq.value.trim(); let u='https://www.google.com/';
    if(q){u=/^https?:\/\/\S+$/i.test(q)?q:(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q)?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q))}
    gq.value=''; gq.blur(); closeAllPopups(); openApp('webbrowser',u);
  }
  $('.gs',bar).addEventListener('click',e=>{e.stopPropagation();go()});
  /* Nút mic: mở bộ nhận dạng giọng nói của Android (giống app Y-utubecuatoi), nói xong tự tìm trên Google */
  const gm=$('.gm',bar), AL=window.AndroidLauncher;
  if(!AL||!AL.startVoiceSearch)gm.hidden=true;
  else gm.addEventListener('click',e=>{e.stopPropagation();gq.blur();try{AL.startVoiceSearch()}catch(x){}});
  window.nativeVoiceResult=t=>{t=String(t||'').trim();if(!t)return;gq.value=t;go()};
  $('.gg',bar).addEventListener('click',e=>{e.stopPropagation();if(e.currentTarget._lp){e.currentTarget._lp=false;return}gq.value='';closeAllPopups();openApp('webbrowser','https://www.google.com/')});
  gq.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();go()}else if(e.key==='Escape')gq.blur()});
  ['keyup','keypress'].forEach(t=>gq.addEventListener(t,e=>e.stopPropagation()));
  ['pointerdown','click','dblclick'].forEach(t=>bar.addEventListener(t,e=>e.stopPropagation()));
  const hide=()=>setPref('gbar',false);
  bindHold(bar,'.gg',(el,cx,cy,r)=>popAt(cx,cy,[{t:'Ẩn thanh tìm kiếm Google',fn:hide}],r));
  bar.addEventListener('contextmenu',e=>{if(e.target.closest('input'))return;e.preventDefault();popAt(e.clientX,e.clientY,[{t:'Ẩn thanh tìm kiếm Google',fn:hide}])});
})();

/* ---------- Cửa sổ ---------- */
const activeWin=()=>$('.win.focus',layer);
function focusWin(w){
  z++; w.style.zIndex=z;
  $$('.win',layer).forEach(x=>x.classList.toggle('focus',x===w));
  appname.textContent=APPS[w.dataset.app].name;
  bus.emit('focus',w);
