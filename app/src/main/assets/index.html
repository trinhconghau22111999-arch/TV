}
function focusTop(){
  let best=null;
  $$('.win',layer).forEach(x=>{
    if(x.classList.contains('min')||x._leaving)return;
    if(!best||(+x.style.zIndex)>(+best.style.zIndex))best=x;
  });
  if(best)focusWin(best);
  else{appname.textContent='Desktop';$$('.win',layer).forEach(x=>x.classList.remove('focus'));bus.emit('focus',null)}
}
function dockCenter(id){
  const d=dockBtn(id), s=stage.getBoundingClientRect();
  if(!d)return {x:s.width/2,y:s.height-30};
  /* Ô đang chạy hiệu ứng mở rộng: đo vị trí cuối cùng để cửa sổ bay đúng về chỗ icon sẽ nằm, không bay theo ô đang giãn */
  const growing=d.classList.contains('dkenter'); if(growing)d.style.animation='none';
  const r=d.getBoundingClientRect();
  if(growing)d.style.animation='';
  return {x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top};
}
function flyIn(w,id){
  return;   /* đã tắt hiệu ứng cửa sổ bay ra từ icon Dock khi mở app (cửa sổ hiện ngay); muốn bật lại thì xóa dòng này */
  if(reduce)return;
  const c=dockCenter(id);
  w.style.transformOrigin=(c.x-w.offsetLeft)+'px '+(c.y-w.offsetTop)+'px';
  w.animate([{transform:'scale(.05,.03)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:420,easing:'cubic-bezier(.22,.9,.28,1)'});
}
function flyOut(w,id,done){
  if(reduce){done();return}
  const c=dockCenter(id);
  w.style.transformOrigin=(c.x-w.offsetLeft)+'px '+(c.y-w.offsetTop)+'px';
  const a=w.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.05,.03)',opacity:0}],{duration:340,easing:'cubic-bezier(.5,0,.75,.35)',fill:'forwards'});
  a.onfinish=()=>{done();a.cancel()};
}
/* Trình duyệt thật: lần đầu chọn, các lần sau mở thẳng trình duyệt đã chọn */
function openApp(id,arg){
  closeAllPopups();
  if(id==='launchpad'){toggleLP();return}
  if(typeof id==='string'&&id.indexOf('x:')===0){if(typeof lpOn!=='undefined'&&lpOn)closeLP();extLaunch(id.slice(2));return}
  if(!APPS[id])return;
  /* "Trình duyệt" và "Ổ mềm" chạy bằng Gecko nên nằm trong app phụ riêng (không dùng chung WebView với giao diện này): bấm biểu tượng là mở app phụ (thấy Dock như app ngoài), thoát thì quay về Desktop Mini. Chưa cài thì Android hỏi cài. */
  if((id==='browser'||id==='omem')&&window.AndroidLauncher&&window.AndroidLauncher.openCompanion){
    try{window.AndroidLauncher.openCompanion(id,typeof arg==='string'?arg:(arg&&(arg.url||arg.profile))||'',!!(arg&&arg.upload))}catch(e){}
    return;
  }
  /* "YouTube", "Gõ văn bản" chạy trong cửa sổ như các app khác (WebView gốc nhúng) */
  const w=wins[id];
  if(w){
    if(w.classList.contains('min')){w.classList.remove('min');flyIn(w,id)}
    focusWin(w);
    if(arg&&w._api&&w._api.open)w._api.open(arg);
    return;
  }
  if(opening[id])return;
  const dk=dockBtn(id); opening[id]=true;
  if(dk&&!reduce)dk.classList.add('bounce');
  setTimeout(()=>{if(dk)dk.classList.remove('bounce');delete opening[id];createWin(id,arg)},(dk&&!reduce)?540:0);
}
/* Chiều cao Dock hiện tại (cỡ icon + 18px): cửa sổ chừa đúng chừng này ở đáy, Dock thu nhỏ thì cửa sổ mở rộng theo */
const DOCK_OV=8; /* cửa sổ chui xuống dưới Dock 8px nên không còn hở lộ hình nền khi Dock nhỏ lại */
/* Dock cao 48dp cố định (số đo thật trên máy, cả ngang lẫn dọc); cửa sổ chui xuống dưới Dock 4dp nên không hở */
/* Đáy cửa sổ = mép trên Dock thật (+4px chui xuống dưới). Vùng nhìn của trang ngắn hơn màn hình thật nên tính theo toạ độ màn hình do Android báo, không tính theo innerHeight. */
const dockRes=()=>{try{const A=window.AndroidLauncher,t=A&&A.dockTopCss?+A.dockTopCss():0; if(t>0)return Math.max(0,Math.round((innerHeight-(t+4))*10)/10)}catch(e){} return 44};
/* Bỏ hàng tiêu đề trên cùng của mọi cửa sổ app con (3 nút x − + và thanh tên/nút của app): nội dung dồn lên sát mép trên.
   Chỉ ẩn thanh nằm sát đỉnh và gần full chiều ngang; thanh nào hiện ra muộn (app nạp lười) cũng được xử lý. Máy tính (.calc) giữ nguyên vì thanh của nó là màn hình hiển thị. */
const KEEPBAR=['mail','notes','calendar','clock'];
function stripTop(w){
  const body=w.querySelector('.body'); if(!body)return;
  if(KEEPBAR.indexOf(w.dataset.app)>=0)return;   /* Thư, Ghi chú, Lịch, Đồng hồ: thanh có nút chuyển tab/soạn/lưu/tháng nên giữ lại */
  let t=0;
  const run=()=>{t=0;
    const br=body.getBoundingClientRect(); if(!br.width)return;
    body.querySelectorAll('.bar,.pvh').forEach(el=>{
      if(el.dataset.nb||el.closest('.calc'))return;
      const r=el.getBoundingClientRect(); if(!r.width||!r.height)return;
      el.dataset.nb='1';
      if(r.top-br.top<=6&&r.width>=br.width*0.6)el.classList.add('nobar');
    });
  };
  /* Theo dõi nội dung chỉ trong lúc cửa sổ đang dựng/đổi trang; yên 8 giây thì ngắt (đỡ tốn máy), chạm vào cửa sổ thì theo dõi lại */
  let mo=null,idle=0;
  const arm=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(mo){mo.disconnect();mo=null}},8000)};
  const on=()=>{
    if(mo){arm();return}
    try{mo=new MutationObserver(()=>{arm();if(!t)t=setTimeout(run,150)});mo.observe(body,{childList:true,subtree:true})}catch(e){}
    arm();
  };
  body.addEventListener('pointerdown',on,{passive:true});
  on(); setTimeout(run,0);
}
function createWin(id,arg){
  const a=APPS[id], sr=stage.getBoundingClientRect();
  const w=document.createElement('section');
  w.className='win'+(a.dark?' dark-win':''); w.dataset.app=id; w.setAttribute('aria-label',a.name);
  w.innerHTML='<div class="tls"><button class="tl c" aria-label="Đóng">×</button><button class="tl m" aria-label="Thu nhỏ">−</button><button class="tl z" aria-label="Phóng to">+</button></div><div class="body"></div><i class="rz" data-d="r"></i><i class="rz" data-d="b"></i><i class="rz" data-d="br"></i><i class="rz" data-d="l"></i>';
  stripTop(w);
  const wideC=id==='calc'&&sr.width>sr.height*1.25, bw=Math.min(wideC?Math.max(a.w,460):a.w,sr.width-24), n=count++%5, fillH=sr.height-40-dockRes(), fill=a.h>=fillH, bh=fill?fillH:a.h;

/* ---------- Âm lịch (thuật toán Hồ Ngọc Đức, múi giờ +7) ---------- */
const LUNAR=(function(){
  const PI=Math.PI, TZ=7, fl=Math.floor;
  const jdFrom=(d,m,y)=>{const a=fl((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+fl((153*mm+2)/5)+365*yy+fl(yy/4)-fl(yy/100)+fl(yy/400)-32045};
  function newMoon(k){

    let Jd1=2415020.75933+29.53058868*k+.0001178*T2-.000000155*T3+.00033*Math.sin((166.56+132.87*T-.009173*T2)*dr);
    const M=359.2242+29.10535608*k-.0000333*T2-.00000347*T3, Mpr=306.0253+385.81691806*k+.0107306*T2+.00001236*T3, F=21.2964+390.67050646*k-.0016528*T2-.00000239*T3;
    let C1=(.1734-.000393*T)*Math.sin(M*dr)+.0021*Math.sin(2*dr*M)-.4068*Math.sin(Mpr*dr)+.0161*Math.sin(dr*2*Mpr)-.0004*Math.sin(dr*3*Mpr)+.0104*Math.sin(dr*2*F)-.0051*Math.sin(dr*(M+Mpr))-.0074*Math.sin(dr*(M-Mpr))+.0004*Math.sin(dr*(2*F+M))-.0004*Math.sin(dr*(2*F-M))-.0006*Math.sin(dr*(2*F+Mpr))+.001*Math.sin(dr*(2*F-Mpr))+.0005*Math.sin(dr*(2*Mpr+M));
    const dt=T<-11?.001+.000839*T+.0002261*T2-.00000845*T3-.000000081*T*T3:-.000278+.000265*T+.000262*T2;
    return Jd1+C1-dt;
  }
  function sunLon(jdn){
    const T=(jdn-2451545)/36525,T2=T*T,dr=PI/180,M=357.5291+35999.0503*T-.0001559*T2-.00000048*T*T2,L0=280.46645+36000.76983*T+.0003032*T2;
    let DL=(1.9146-.004817*T-.000014*T2)*Math.sin(dr*M)+(.019993-.000101*T)*Math.sin(dr*2*M)+.00029*Math.sin(dr*3*M);
    let L=(L0+DL)*dr; L-=PI*2*fl(L/(PI*2)); return L;
  }
  const nmDay=k=>fl(newMoon(k)+.5+TZ/24), sunL=d=>fl(sunLon(d-.5-TZ/24)/PI*6);
  function m11(yy){
    const off=jdFrom(31,12,yy)-2415021, k=fl(off/29.530588853); let nm=nmDay(k);

  }
  function leapOff(a11){

  }
  function conv(dd,mm,yy){
    const dn=jdFrom(dd,mm,yy), k=fl((dn-2415021.076998695)/29.530588853);
    let ms=nmDay(k+1); if(ms>dn)ms=nmDay(k);
    let a11=m11(yy), b11=a11, ly;
    if(a11>=ms){ly=yy;a11=m11(yy-1)}else{ly=yy+1;b11=m11(yy+1)}
    const ld=dn-ms+1, diff=fl((ms-a11)/29);

  }

  const yname=y=>CAN[(y+6)%10]+' '+CHI[(y+8)%12];
  return {conv,yname};
})();

const DAYMS=864e5; let DEVC={}, DEVT=0;
function icalOn(d){
  const A=window.AndroidLauncher; if(!A||!A.getDeviceEvents)return [];
  if(Date.now()-DEVT>3e5){DEVC={};DEVT=Date.now()}
  const t0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  if(!(t0 in DEVC)){
    let l=[]; try{l=JSON.parse(A.getDeviceEvents(t0,t0+DAYMS))}catch(e){}
    DEVC[t0]=l.map(e=>{
      let s=e.s;
      if(e.all){const u=new Date(e.s);s=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate()).getTime()}
      const sd=new Date(s), same=!e.all&&s>=t0&&s<t0+DAYMS;
      return {t:e.t,time:same?pad(sd.getHours())+':'+pad(sd.getMinutes()):'',all:!!e.all,s:same?s:t0};
    });
  }
  return DEVC[t0];

    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
function beep(){
  const a=getAudio(); if(!a)return;
  const v=pref('vol',60)/100; if(!v)return;
  [0,.25,.5].forEach(d=>{
    const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0,a.currentTime+d); g.gain.linearRampToValueAtTime(.2*v,a.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.22);
    o.connect(g); g.connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+.25);
  });
}

const MUS={idx:-1,playing:false,pos:0,dur:120,step:0,timer:null};
const SEQ=[0,2,1,3,2,4,3,1];
function musNote(midi,len,type){
  const a=getAudio(); if(!a)return;
  const v=pref('vol',60)/100; if(!v)return;
  const o=a.createOscillator(), g=a.createGain(), f=440*Math.pow(2,(midi-69)/12), t=a.currentTime;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16*v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+len+.05);
}
function musTick(){
  const tr=TRK[MUS.idx];
  /* Danh sách bài đã đổi sang nhạc thật (không có nốt tổng hợp) khi vòng đếm tổng hợp còn chạy: dừng vòng đếm, không báo lỗi lặp mỗi nhịp */
  if(!tr||!tr.sc||!tr.bpm){clearInterval(MUS.timer);MUS.timer=null;return}
  const st=60000/tr.bpm/2;
  const s=MUS.step, deg=SEQ[s%8], oct=Math.floor(s/8)%2?12:0;
  musNote(tr.root+tr.sc[deg]+oct,(st/1000)*2.4,tr.wave);
  if(s%8===0)musNote(tr.root-12+tr.sc[0],(st/1000)*6,'sine');
  MUS.step++; MUS.pos+=st/1000;
  if(MUS.pos>=MUS.dur){musNext();return}
  bus.emit('music');
}
function musLoop(){
  clearInterval(MUS.timer);
  if(!MUS.playing)return;
  MUS.timer=setInterval(musTick,60000/TRK[MUS.idx].bpm/2);
}
function musPlay(i){
  getAudio();
  MUS.idx=i; MUS.pos=0; MUS.step=0; MUS.playing=true; musLoop(); bus.emit('music');
}
function musToggle(){
  if(MUS.idx<0){musPlay(0);return}
  MUS.playing=!MUS.playing; if(MUS.playing)getAudio(); musLoop(); bus.emit('music');
}
function musNext(){musPlay((MUS.idx+1)%TRK.length)}
function musPrev(){if(MUS.pos>4)musPlay(MUS.idx);else musPlay((MUS.idx-1+TRK.length)%TRK.length)}
function musSeek(s){MUS.pos=s;bus.emit('music')}

const NOTIFS=[];
const nIcon=n=>n.img?'<span class="ic" style="background:#fff"><img src="'+n.img+'" alt="" style="width:100%;height:100%;object-fit:cover"></span>':iconHTML(n.icon&&ICONS[n.icon]?n.icon:'about');
let LASTN={k:'',t:0};
function notify(n){
  /* cùng một thông báo (app + tiêu đề + nội dung) lặp lại trong vòng 1,5 giây thì chỉ hiện một lần */
  const nk=(n.app||'')+'|'+(n.title||'')+'|'+(n.body||''), nt=Date.now();
  if(nk===LASTN.k&&nt-LASTN.t<1500)return;
  LASTN={k:nk,t:nt};
  n.t=Date.now(); NOTIFS.unshift(n); if(NOTIFS.length>20)NOTIFS.pop(); bus.emit('notif');
  if(pref('dnd',false))return;
  const el=document.createElement('button'); el.className='bn';
  el.innerHTML=nIcon(n)+'<span><small>'+esc(n.app)+'</small><b>'+esc(n.title)+'</b><em>'+esc(n.body||'')+'</em></span>';
  el.addEventListener('click',()=>{if(el._sw){el._sw=false;return}el.remove();if(n.fn)n.fn();else if(n.icon)openApp(n.icon)});
  /* Vuốt thông báo sang phải để ẩn bỏ ngay (kéo quá ~70px hoặc vuốt nhanh thì bay đi, chưa đủ thì bật về chỗ cũ) */
  {let sx=0,sy=0,dx=0,t0=0,pid=null,drag=false;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;sx=e.clientX;sy=e.clientY;dx=0;t0=performance.now();pid=e.pointerId;drag=false});
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    const x=e.clientX-sx,y=e.clientY-sy;
    if(!drag){if(x>8&&x>Math.abs(y)*1.2){drag=true;try{el.setPointerCapture(pid)}catch(_){}el.style.animation='none';el.style.transition='none'}else return}
    dx=Math.max(0,x);el.style.transform='translateX('+dx+'px)';el.style.opacity=String(Math.max(.15,1-dx/260));
  });
  const end=e=>{
    if(e.pointerId!==pid)return; pid=null;
    if(!drag)return;
    el._sw=true;setTimeout(()=>{el._sw=false},350);

    const r=Function('"use strict";return ('+e+')')();

    if(qt.every(t=>kt.some(k=>k.indexOf(t)===0)))return 60;
    if(qt.every(t=>key.indexOf(t)>=0))return 50;

      }

  }
  window.dmAI={parse:parse,rank:rank,close:aiClose};   /* để kiểm thử / gọi từ nơi khác */

  /* Chụp ảnh màn hình: ẩn hai nút một nhịp rồi nhờ Android chụp cả cửa sổ, lưu vào Pictures/Screenshots */

  };
  shotBtn.addEventListener('click',e=>{
    e.stopPropagation(); if(shotBusy)return;
    closeAllPopups(); aiClose();
    if(!QA||!QA.takeScreenshot){notify({app:'Ảnh chụp màn hình',title:'Chỉ chụp được trong ứng dụng Android',icon:'settings'});return}

let mcLabels=[];
function enterMC(){
  closeAllPopups(); if(lpOn)closeLP();
  const ws=$$('.win',layer).filter(w=>!w.classList.contains('min')&&!w._leaving);
  mcOn=true; $('#mcx').hidden=false; stage.classList.remove('mcx'); stage.classList.add('mc');
  $('#mcbg').innerHTML='<div class="mcsp"><span>Desktop 1</span></div>'+(ws.length?'':'<div class="mcnone">Không có cửa sổ nào đang mở</div>');
  const sr=stage.getBoundingClientRect(), base=parseFloat(getComputedStyle(stage).getPropertyValue('--base'))||54;
  const x0=24, y0=84, W=sr.width-48, H=sr.height-y0-(base+44), gap=22, n=ws.length||1;
  const cols=Math.ceil(Math.sqrt(n*W/Math.max(H,1))), rows=Math.ceil(n/cols);
  const cw=(W-(cols-1)*gap)/cols, ch=(H-(rows-1)*gap-rows*20)/rows;
  mcLabels.forEach(l=>l.remove()); mcLabels=[];
  ws.forEach((w,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    const s=Math.min(cw/w.offsetWidth,ch/w.offsetHeight,.85);
    const tx=x0+c*(cw+gap)+(cw-w.offsetWidth*s)/2, ty=y0+r*(ch+gap+20)+(ch-w.offsetHeight*s)/2;
    w.style.transformOrigin='0 0';
    w.style.transform='translate('+(tx-w.offsetLeft)+'px,'+(ty-w.offsetTop)+'px) scale('+s+')';
    const l=document.createElement('div'); l.className='mcl'; l.textContent=APPS[w.dataset.app].name;
    l.style.left=tx+'px'; l.style.top=(ty+w.offsetHeight*s+6)+'px'; l.style.width=(w.offsetWidth*s)+'px';
    layer.appendChild(l); mcLabels.push(l);
  });
}
function exitMC(pick){
  if(!mcOn)return; mcOn=false; $('#mcx').hidden=true;
  $$('.win',layer).forEach(w=>{w.style.transform=''});

/* --- Mật khẩu màn hình thật: ký tự (ngang), PIN hoặc hình vẽ (dọc) --- */
const sha256=(()=>{
  const K=[],H0=[]; let n=2,c=0; const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(c<64){if(isP(n)){if(c<8)H0.push((Math.pow(n,.5)%1)*4294967296|0);K.push((Math.pow(n,1/3)%1)*4294967296|0);c++}n++}
  const rr=(x,k)=>(x>>>k)|(x<<(32-k));
  return str=>{
    const b=unescape(encodeURIComponent(str)), l=b.length, w=[];
    for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
    w[l>>2]|=0x80<<(24-(l%4)*8);
    const len=(((l+8)>>6)+1)*16; for(let i=0;i<len;i++)if(w[i]===undefined)w[i]=0; w[len-1]=l*8;
    let h=H0.slice();
    for(let o=0;o<len;o+=16){
      const m=w.slice(o,o+16);
      for(let i=16;i<64;i++){const x=m[i-15],y=m[i-2];m[i]=(m[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+m[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
      let [a,b2,c2,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){
        const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+m[i])|0, t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
      }
      h=[h[0]+a|0,h[1]+b2|0,h[2]+c2|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
    }
    return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
  };
})();
const LK='dm-lock', lk=()=>jget(LK,{});
const hasLock=()=>{const o=lk();return !!(o.pw||o.pin||o.pat)};
const lkHash=(k,v)=>{let o=lk();if(!o.s){o.s=Math.random().toString(36).slice(2)+Date.now().toString(36);jset(LK,o)}return sha256(lk().s+'|'+k+'|'+v)};
const lkSet=(k,v)=>{const h=lkHash(k,v),o=lk();o[k]=h;if(k==='pin')o.pl=v.length;jset(LK,o)};
const lkDel=k=>{const o=lk();delete o[k];if(k==='pin')delete o.pl;jset(LK,o)};
const lkChk=(k,v)=>lk()[k]===lkHash(k,v);
const isPortrait=()=>window.innerHeight>=window.innerWidth;
/* Ngang -> mật khẩu ký tự; dọc -> PIN hoặc hình vẽ theo lựa chọn. Nếu kiểu cần chưa đặt thì dùng kiểu đã đặt, không để lọt khóa. */
function lockKind(){const o=lk(),want=isPortrait()?'pin':'pw';return o[want]?want:(['pw','pin','pat'].find(k=>o[k])||'pw')}

function authUI(el,kind,o){
  el.innerHTML='<div class="amsg"></div><div class="abody"></div>';
  const msg=$('.amsg',el), bd=$('.abody',el); msg.textContent=o.title||'';
  const fail=t=>{msg.textContent=t;msg.classList.remove('shake');void msg.offsetWidth;msg.classList.add('shake')};
  const submit=v=>{const r=o.onSubmit(v); if(r!==true&&r!==undefined)fail(typeof r==='string'?r:'Sai, thử lại'); return r===true};
  if(kind==='pw'){
    bd.innerHTML='<form class="apw" autocomplete="off"><input type="password" autocomplete="off" placeholder="Mật khẩu" aria-label="Mật khẩu"><button class="go" type="submit" aria-label="Xác nhận"><svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>';
    const f=$('form',bd), inp=$('input',bd);
    f.addEventListener('submit',e=>{e.preventDefault();const v=inp.value;if(!submit(v)){inp.value='';inp.focus()}});
    setTimeout(()=>inp.focus(),80);
  }else if(kind==='pin'){
    let v='';
    bd.innerHTML='<div class="adots"></div><div class="apad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-d="'+n+'">'+n+'</button>').join('')+'<button type="button" class="nb" data-a="ok" aria-label="Xác nhận">✓</button><button type="button" data-d="0">0</button><button type="button" class="nb" data-a="del" aria-label="Xóa số">⌫</button></div>';
    const dots=$('.adots',bd);
    const draw=()=>{const n=Math.max(o.len||4,v.length);dots.innerHTML=[...Array(n)].map((_,i)=>'<i'+(i<v.length?' class="f"':'')+'></i>').join('')};
    const send=()=>{const x=v; if(!submit(x)){v='';draw()}};
    draw();
    bd.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b)return;
      if(b.dataset.d!==undefined){if(v.length<8){v+=b.dataset.d;draw();if(o.len&&v.length===o.len)send()}}
      else if(b.dataset.a==='del'){v=v.slice(0,-1);draw()}
      else if(b.dataset.a==='ok'){if(v.length>=4)send();else fail('Tối thiểu 4 số')}
    });
  }else{
    const P=[...Array(9)].map((_,i)=>[20+40*(i%3),20+40*Math.floor(i/3)]);
    bd.innerHTML='<div class="apat"><svg viewBox="0 0 120 120"><polyline fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>'+P.map((p,i)=>'<circle data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="currentColor" opacity=".55"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>').join('')+'</svg></div>';
    const svg=$('svg',bd), pl=$('polyline',bd); let seq=[], drag=false, busy=false;
    const pt=e=>{const r=svg.getBoundingClientRect();return [(e.clientX-r.left)*120/r.width,(e.clientY-r.top)*120/r.height]};
    const hit=(x,y)=>{for(let i=0;i<9;i++)if(Math.hypot(P[i][0]-x,P[i][1]-y)<14)return i;return -1};
    const lit=()=>$$('circle[data-i]',svg).forEach(c=>c.setAttribute('opacity',seq.indexOf(+c.dataset.i)>=0?'1':'.55'));
    const line=(x,y)=>{pl.setAttribute('points',seq.map(i=>P[i].join(',')).concat(x!=null?[x+','+y]:[]).join(' '))};
    const reset=()=>{seq=[];line();lit();busy=false};
    svg.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();drag=true;seq=[];try{svg.setPointerCapture(e.pointerId)}catch(x){}const [x,y]=pt(e),i=hit(x,y);if(i>=0)seq.push(i);line(x,y);lit()});
    svg.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=pt(e),i=hit(x,y);if(i>=0&&seq.indexOf(i)<0)seq.push(i);line(x,y);lit()});
    const end=()=>{
      if(!drag)return; drag=false; line(); busy=true;
      if(seq.length<4){fail('Nối ít nhất 4 điểm');setTimeout(reset,500);return}
      const ok=submit(seq.join('')); setTimeout(reset,ok?0:600);
    };
    svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  }
}

let deskDragEnd=0, deskDragOn=false;
(function(){
  let dr=null;
  const metrics=()=>{
    const cs=getComputedStyle(desk), r=desk.getBoundingClientRect();
    const rows=deskRows();
    const cw=parseFloat(cs.gridAutoColumns)||84, ch=98;
    const gx=parseFloat(cs.columnGap)||0, gy=parseFloat(cs.rowGap)||0;
    return {rows,cw:cw+gx,ch:ch+gy,x0:r.left+parseFloat(cs.paddingLeft)-desk.scrollLeft,y0:r.top+parseFloat(cs.paddingTop)};
  };
  desk.addEventListener('pointerdown',e=>{
    if(e.button>0||stage.classList.contains('mc'))return;
    const el=e.target.closest('.da'); if(!el)return;
    dr={el,sx:e.clientX,sy:e.clientY,pid:e.pointerId,on:false,gh:null,ox:0,oy:0};

  window.addEventListener('pointermove',e=>{
    if(!dr||e.pointerId!==dr.pid)return;
    if(dr.on&&e.pointerType==='mouse'&&e.buttons===0){end({pointerId:dr.pid,type:'pointerup'});return}   /* nhả chuột ngoài cửa sổ mà không nhận được pointerup */
    const sr=stage.getBoundingClientRect();
    if(!dr.on){
      const dx=e.clientX-dr.sx, dy=e.clientY-dr.sy;
      if(dx*dx+dy*dy<64)return;
      dr.on=true; closeAllPopups(); dr.el._lp=false; clearTimeout(lpT);
      const r=dr.el.getBoundingClientRect(); dr.ox=dr.sx-r.left; dr.oy=dr.sy-r.top;
      const g=dr.el.cloneNode(true); g.className='da dghost'; g.style.width=r.width+'px'; g.style.height=r.height+'px';
      stage.appendChild(g); dr.gh=g; dr.el.classList.add('dmov');
      dr.pos=deskLayout(deskRows()); dr.from=dr.pos[dr.el.dataset.app]; dr.tgt=null; dr.occ=null; deskDragOn=true;
      if(DSEL.size>1&&DSEL.has(dr.el.dataset.app)){dr.group=[...DSEL]; dr.group.forEach(k=>{const q=$('.da[data-app="'+k+'"]',desk); if(q)q.classList.add('dmov')})}
    }
    dr.gh.style.left=(e.clientX-dr.ox-sr.left)+'px'; dr.gh.style.top=(e.clientY-dr.oy-sr.top)+'px';
    const dRect=desk.getBoundingClientRect();
    if(e.clientX<dRect.left+48)desk.scrollLeft-=14; else if(e.clientX>dRect.right-48)desk.scrollLeft+=14;
    const m=metrics(), id=dr.el.dataset.app;
    let col=Math.floor((e.clientX-m.x0)/m.cw), row=Math.floor((e.clientY-m.y0)/m.ch);
    let maxCol=0; for(const k in dr.pos)maxCol=Math.max(maxCol,dr.pos[k][0]);
    row=Math.max(0,Math.min(m.rows-1,row)); col=Math.max(0,Math.min(maxCol+1,col));
    dr.tgt=[col,row];
    if(dr.group)return;   /* kéo cả nhóm: icon gốc ở yên, chỉ tính ô đích */
    let occ=null; for(const k in dr.pos){if(k!==id&&dr.pos[k][0]===col&&dr.pos[k][1]===row){occ=k;break}}
    if(occ!==dr.occ){
      const old=dr.occ&&$('.da[data-app="'+dr.occ+'"]',desk); if(old)old.classList.remove('dtgt');
      const nw=occ&&$('.da[data-app="'+occ+'"]',desk); if(nw)nw.classList.add('dtgt');
      dr.occ=occ;
    }
    /* Ô trống: icon gốc (mờ) nhảy theo vào ô đó; ô có icon: icon gốc ở lại chỗ cũ, icon kia được tô sáng để báo sẽ đổi chỗ */

  });
  const end=e=>{
    if(!dr||e.pointerId!==dr.pid)return;
    const d=dr; dr=null;

    deskDragEnd=Date.now(); deskDragOn=false;

    if(d.group){
      $$('.da.dmov',desk).forEach(q=>q.classList.remove('dmov'));
      if(e.type==='pointerup'&&d.tgt&&d.from){
        const dx=d.tgt[0]-d.from[0], dy=d.tgt[1]-d.from[1], rows=deskRows(), np={}; let ok=true;
        d.group.forEach(k=>{const p=d.pos[k]; if(!p){ok=false;return} const c=p[0]+dx, r=p[1]+dy; if(c<0||r<0||r>=rows)ok=false; np[k]=[c,r]});
        if(ok)for(const k in d.pos){if(d.group.indexOf(k)<0){const p=d.pos[k]; for(const g in np)if(np[g][0]===p[0]&&np[g][1]===p[1])ok=false}}
        if(ok){const prev=DESKPOS; DESKPOS={}; for(const k in prev)if(Array.isArray(prev[k]))DESKPOS[k]=prev[k]; for(const k in d.pos)if(!Array.isArray(prev[k]))DESKPOS[k]=[d.pos[k][0],d.pos[k][1]]; for(const k in np)DESKPOS[k]=np[k]; saveDeskPos()}

})();
/* Kéo khung trên nền trống (bằng chuột) để chọn nhiều icon; kéo 1 icon đã chọn thì cả nhóm di chuyển cùng; thả chuột ra là hiện menu Xóa khỏi màn hình */
var DSEL=new Set();

(function(){

      if(/screenshot|screen_shot|screen-shot|chụp màn hình|chup man hinh|webandr/.test(lp))e.k='shot';
      else if(/dcim\/camera|dcim\/100|desktop mini|desktopmini/.test(lp)||/^(img|pxl)_\d{8}_\d{6}/.test((p.n||'').toLowerCase()))e.k='cam';
      PH.push(e)});
  }
  loadPhotos();
  const q=[]; let run=false;
  function pump(){
    if(run)return; run=true;
    (function next(){
      const img=q.shift(); if(!img){run=false;return}
      if(!img.isConnected||img.src){next();return}
      const big=!!img.closest('.pv');
      setTimeout(()=>{const d=safe(()=>A.getPhotoData(+img.dataset.pid,big?1080:260),'');if(d)img.src=d;next()},0);
    })();
  }
  new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    (n.matches&&n.matches('img.rp')?[n]:[...n.querySelectorAll('img.rp')]).forEach(i=>{if(big_ok(i))q.push(i)});
  }));pump()}).observe(document.body,{childList:true,subtree:true});
  function big_ok(i){return !i.getAttribute('src')}
  let phSig='';
  window.nativeReload=function(){loadTracks();loadPhotos();const sg=PH.length+'|'+(PH[0]&&PH[0].pid);if(sg!==phSig){phSig=sg;bus.emit('photos')}bus.emit('filesnew');sync();realBatt();insets();if(window.devCalReset)devCalReset()};
  /* Thư = Gmail trong cửa sổ */
  APPS.mail.name='Gmail'; const mb=dockBtn('mail'); if(mb){mb.dataset.label='Gmail';mb.setAttribute('aria-label','Gmail')}
  /* Giới thiệu: thông tin máy thật */
  const inf=safe(()=>JSON.parse(A.getInfo()),{});
  if(inf.model){window.NATIVE_INFO=inf}
})()}

})();

/* Tự tắt bàn phím ảo khi con trỏ không còn ở ô nhập nào: chạm ra ngoài ô, ô bị ẩn/xóa (đóng cửa sổ, đổi tab...), hoặc mất focus */
(function(){
  const A=window.AndroidLauncher; if(!A||!A.hideKeyboardIfIdle)return;
  const isEd=el=>{
    if(!el||el.nodeType!==1)return false;
    const t=el.tagName;
    if(t==='TEXTAREA'||el.isContentEditable)return !el.disabled&&!el.readOnly;
    if(t==='INPUT'){
      const ty=(el.getAttribute('type')||'text').toLowerCase();
      if(['button','checkbox','radio','range','submit','reset','color','file','image'].indexOf(ty)>=0)return false;
      return !el.disabled&&!el.readOnly;
    }
    return false;
  };
  let tm=0;
  const flag=v=>{try{A.setHtmlEditing&&A.setHtmlEditing(v)}catch(e){}};
  const check=(d,force)=>{
    clearTimeout(tm);
    tm=setTimeout(()=>{
      const a=document.activeElement;
      if(isEd(a)){
        if(!force&&a.offsetParent!==null&&!a.closest('[hidden]')){flag(true);return} /* vẫn đang gõ trong ô hợp lệ */
        try{a.blur()}catch(e){}
      }
      flag(false);
      try{A.hideKeyboardIfIdle()}catch(e){}
    },d);
  };
  /* mất focus khỏi ô nhập mà không chuyển sang ô nhập khác */
  document.addEventListener('focusout',()=>check(120),true);
  /* chạm/bấm vào chỗ không phải ô nhập: bỏ focus ô đang gõ (nếu có) rồi tắt bàn phím - kể cả khi bàn phím đang là của trang Gecko nhúng */
  document.addEventListener('pointerdown',e=>{
    const t=e.target;
    if(isEd(t)||(t.closest&&t.closest('label')))return;
    check(60,true);
  },true);
  /* ô nhập đang focus bị xóa/ẩn khỏi trang (focusout không bắn trong trường hợp này) */
  let had=false;
  new MutationObserver(()=>{
    const a=document.activeElement, ed=isEd(a);
    if(ed){had=true;return}
    if(had){had=false;check(100)}
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','style','class']});
  document.addEventListener('focusin',e=>{had=isEd(e.target);flag(had)},true);
  /* mở lại app / đổi cửa sổ */
  document.addEventListener('visibilitychange',()=>{if(document.hidden)check(0)});
})();

</script>
